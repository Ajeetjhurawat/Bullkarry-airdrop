          return { ...structuredClone(DEFAULT_STATE), ...parsed };
        }
      } catch (e) {}
      return structuredClone(DEFAULT_STATE);
    }

      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    }

    // THEME (Light Default + Dark Toggle)
    // =========================================================================
    function initTheme() {
      let saved = 'light';
      try { saved = localStorage.getItem('bullkarry_theme') || 'light'; } catch (e) {}
      applyTheme(saved);
    }

    function applyTheme(mode) {
      const html = document.documentElement;
      const moon = document.getElementById('iconMoon');
      const sun = document.getElementById('iconSun');
      if (mode === 'dark') {
        html.classList.add('dark'); moon.classList.add('hidden'); sun.classList.remove('hidden');
      } else {
        html.classList.remove('dark'); moon.classList.remove('hidden'); sun.classList.add('hidden');
      }
      try { localStorage.setItem('bullkarry_theme', mode); } catch (e) {}
    }

    function toggleTheme() {
      applyTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark');
    }

      const activeCount = state.airdrops.filter(a => a.status === 'Active').length;
      document.getElementById('sidebarProjectCount').textContent = `${activeCount} Active Campaigns`;
      document.getElementById('headerSavedCount').textContent = `${state.tracker.savedIds.length} Tracked`;

      const navEl = document.getElementById('sidebarNav');
      navEl.innerHTML = state.menus.filter(m => m.visible).map(m => {
        const isActive = currentRoute === m.id || (currentRoute === 'detail' && m.id === 'airdrops') || (currentRoute === 'home' && m.id === 'airdrops');
        const cls = isActive
          ? 'bg-[#eef4ff] text-[#2563eb] border border-[#dbeafe] dark:bg-blue-500/15 dark:text-blue-400 dark:border-blue-500/25 font-bold shadow-xs'
          : 'text-slate-600 dark:text-zinc-300 hover:bg-slate-50 dark:hover:bg-zinc-800/80 hover:text-slate-900 dark:hover:text-white border border-transparent font-semibold';
        return `
          <button onclick="navigateTo('${m.id}')" class="w-full flex items-center gap-3.5 px-4 py-3 rounded-2xl text-[15px] transition-all ${cls}">
            ${getMenuIcon(m.icon)}
            <span class="truncate">${escapeHtml(m.label)}</span>
          </button>
        `;
      }).join('');

      const hLogo = document.getElementById('headerBrandLogo');
      const hName = document.getElementById('headerBrandName');
      if (hLogo) {
        if (state.settings.brandLogoUrl) hLogo.innerHTML = `<img src="${escapeAttr(state.settings.brandLogoUrl)}" alt="Brand" class="w-full h-full object-cover" />`;
        else hLogo.textContent = state.settings.brandInitials || 'BK';
      }
      if (hName) hName.textContent = state.settings.brandName || 'Bullkarry';

      // Mobile Bottom Nav (Bullkarry style: 2 left, Center Raised Home Button, 2 right)
      const mobileIds = ['airdrops', 'perps', 'home', 'claims', 'checkers'];
      const mbNav = document.getElementById('mobileBottomNav');
      if (mbNav) {
        mbNav.innerHTML = mobileIds.map((id, idx) => {
          if (idx === 2) {
            return `
              <button onclick="navigateTo('home')" class="relative -mt-6 flex flex-col items-center justify-center group" aria-label="Home">
                <span class="w-[52px] h-[52px] rounded-full bg-blue-600 hover:bg-blue-700 text-white shadow-lg shadow-blue-600/35 ring-4 ring-[#f7f9fc] dark:ring-zinc-950 flex items-center justify-center transition-transform group-active:scale-95">
                  ${getMenuIcon('home')}
                </span>
              </button>
            `;
          }
          const m = state.menus.find(x => x.id === id) || { id, label: id.charAt(0).toUpperCase() + id.slice(1), icon: 'star' };
          const active = currentRoute === id || (currentRoute === 'detail' && id === 'airdrops');
          return `
            <button onclick="navigateTo('${m.id}')" class="flex flex-col items-center justify-center gap-1 px-2.5 py-1 rounded-xl transition-colors ${active ? 'text-blue-600 dark:text-blue-400 font-bold' : 'text-slate-500 dark:text-zinc-400 font-semibold'}">
              ${getMenuIcon(m.icon)}
              <span class="text-[10px] leading-tight">${escapeHtml(m.label)}</span>
            </button>
          `;
        }).join('');
      }

      const s = state.settings.socials || {};
      document.getElementById('footerSocials').innerHTML = `
        <a href="${escapeAttr(s.x || '#')}" target="_blank" rel="noopener" class="w-8 h-8 rounded-lg border border-slate-200/80 dark:border-zinc-700 flex items-center justify-center text-slate-500 hover:text-slate-900 dark:hover:text-white hover:bg-slate-50 dark:hover:bg-zinc-800 transition-colors" title="X / Twitter">${SVG.socialX}</a>
        <a href="${escapeAttr(s.telegram || '#')}" target="_blank" rel="noopener" class="w-8 h-8 rounded-lg border border-slate-200/80 dark:border-zinc-700 flex items-center justify-center text-slate-500 hover:text-slate-900 dark:hover:text-white hover:bg-slate-50 dark:hover:bg-zinc-800 transition-colors" title="Telegram">${SVG.socialTg}</a>
        <a href="${escapeAttr(s.discord || '#')}" target="_blank" rel="noopener" class="w-8 h-8 rounded-lg border border-slate-200/80 dark:border-zinc-700 flex items-center justify-center text-slate-500 hover:text-slate-900 dark:hover:text-white hover:bg-slate-50 dark:hover:bg-zinc-800 transition-colors" title="Discord">${SVG.socialDc}</a>
      `;
    }

    // =========================================================================
    // HELPERS
    // =========================================================================
    function getTintClasses(tint) {
      const map = {
        lavender: 'bg-indigo-50/75 dark:bg-indigo-950/35 border-indigo-200/60 dark:border-indigo-800/50',
        sky: 'bg-sky-50/75 dark:bg-sky-950/35 border-sky-200/60 dark:border-sky-800/50',
        sand: 'bg-amber-50/70 dark:bg-zinc-800/70 border-amber-200/60 dark:border-zinc-700',
        mint: 'bg-emerald-50/75 dark:bg-emerald-950/35 border-emerald-200/60 dark:border-emerald-800/50',
        periwinkle: 'bg-violet-50/75 dark:bg-violet-950/35 border-violet-200/60 dark:border-violet-800/50'
      };
      return map[tint] || map.lavender;
    }

    function getStatusBadge(status) {
      const map = {
        Active: 'bg-emerald-50 text-emerald-700 border-emerald-200/70 dark:bg-emerald-500/15 dark:text-emerald-400 dark:border-emerald-500/30',
        Upcoming: 'bg-amber-50 text-amber-700 border-amber-200/70 dark:bg-amber-500/15 dark:text-amber-400 dark:border-amber-500/30',
        Claimable: 'bg-blue-50 text-blue-700 border-blue-200/70 dark:bg-blue-500/15 dark:text-blue-400 dark:border-blue-500/30',
        Ended: 'bg-slate-100 text-slate-600 border-slate-200 dark:bg-zinc-800 dark:text-zinc-400 dark:border-zinc-700'
      };
      const dot = status === 'Active' ? 'bg-emerald-500' : status === 'Upcoming' ? 'bg-amber-500' : status === 'Claimable' ? 'bg-blue-500' : 'bg-slate-400';
      return `<span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold border ${map[status] || map.Active}"><span class="w-1.5 h-1.5 rounded-full ${dot}"></span>${escapeHtml(status)}</span>`;
    }

    function getTagBadge(tag) {
      const upper = tag.toUpperCase();
      if (upper === 'NEW') return `<span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-emerald-500 text-white">NEW</span>`;
      if (upper === 'HOT') return `<span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-rose-500 text-white">HOT</span>`;
      if (upper === 'TRENDING') return `<span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-amber-500 text-white">TRENDING</span>`;
      if (upper === 'POINTS') return `<span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-blue-50 text-blue-600 dark:bg-blue-500/20 dark:text-blue-300">POINTS</span>`;
      return `<span class="px-2 py-0.5 rounded-md text-[10px] font-medium bg-slate-100 text-slate-600 dark:bg-zinc-800 dark:text-zinc-300">${escapeHtml(tag)}</span>`;
    }

    function renderLogo(item, size = 'w-11 h-11 text-sm') {
      if (item.logoUrl) {
        return `<div class="${size} rounded-xl overflow-hidden shrink-0 border border-slate-200/70 dark:border-zinc-700 bg-white dark:bg-zinc-800 shadow-xs"><img src="${escapeAttr(item.logoUrl)}" alt="${escapeAttr(item.name)}" class="w-full h-full object-cover" /></div>`;
      }
      return `<div class="${size} rounded-xl flex items-center justify-center font-extrabold tracking-tight shrink-0 shadow-xs text-white" style="background:${escapeAttr(item.logoBg || '#1e293b')}">${escapeHtml(item.logoText || item.name.slice(0, 2).toUpperCase())}</div>`;
    }

    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
    function escapeAttr(str) { return escapeHtml(str); }

    // =========================================================================
    // RIGHT SIDEBAR (Manual Sidebar Ads + Quick Checkers + Sentiment + Community)
    // =========================================================================
    function renderRightSidebar(extraDetailWidgets = '') {
      const adsHtml = (state.ads.sidebarAds || []).filter(ad => ad.active).map(ad => {
        if (ad.htmlCode && ad.htmlCode.trim()) {
          return `<a href="${escapeAttr(ad.url || '#')}" target="_blank" rel="noopener" class="block rounded-2xl overflow-hidden border border-slate-200/70 dark:border-zinc-800 shadow-bk hover:shadow-bk-hover transition-all">${ad.htmlCode}</a>`;
        }
        if (ad.imageUrl && ad.imageUrl.trim()) {
          const isVid = ad.isVideo || /\.(mp4|webm|ogg)(\?|$)/i.test(ad.imageUrl) || ad.imageUrl.startsWith('data:video/');
          return `
            <a href="${escapeAttr(ad.url || '#')}" target="_blank" rel="noopener" class="relative block rounded-2xl overflow-hidden border border-slate-200/70 dark:border-zinc-800 shadow-bk hover:shadow-bk-hover transition-all group">
              ${isVid
                ? `<video src="${escapeAttr(ad.imageUrl)}" autoplay loop muted playsinline class="w-full h-64 object-cover block"></video>`
                : `<img src="${escapeAttr(ad.imageUrl)}" alt="${escapeAttr(ad.title || 'Sponsored')}" class="w-full h-64 object-cover block" />`}
              <span class="absolute top-2.5 left-2.5 px-2 py-0.5 rounded-md text-[10px] font-bold bg-slate-900/75 text-white backdrop-blur-xs">${escapeHtml(ad.title || 'SPONSORED')}</span>
              <span class="absolute bottom-2.5 right-2.5 inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-[11px] font-bold bg-white/90 text-slate-900 shadow-xs">${escapeHtml(ad.ctaText || 'Learn more')} ${SVG.arrowUpRight}</span>
            </a>
          `;
        }
        return `
          <a href="${escapeAttr(ad.url)}" target="_blank" rel="noopener" class="block rounded-2xl bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 text-white p-5 border border-slate-800 shadow-bk hover:shadow-bk-hover transition-all group overflow-hidden">
            <div class="flex items-center justify-between mb-2.5">
              <span class="font-bold text-sm text-emerald-400 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-400"></span>${escapeHtml(ad.title)}
              </span>
              <span class="inline-flex items-center gap-1 text-[10px] px-2 py-0.5 rounded-md bg-white/10 text-zinc-200 font-medium">${escapeHtml(ad.ctaText || 'Learn more')} ${SVG.arrowUpRight}</span>
            </div>
            <div class="text-lg font-extrabold leading-snug mb-1">${escapeHtml(ad.headline)}</div>
            <div class="text-xs text-slate-300">${escapeHtml(ad.subtitle)}</div>
          </a>
        `;
      }).join('');

      const promoCardsHtml = (state.ads.sidebarPromoCards || []).filter(c => c.active !== false).map(c => `
        <a href="${escapeAttr(c.url || '#')}" target="_blank" rel="noopener" class="flex items-center justify-between gap-3 p-3.5 rounded-2xl bg-white dark:bg-zinc-900 border border-slate-200/80 dark:border-zinc-800 hover:border-blue-300 dark:hover:border-blue-500/40 shadow-bk hover:shadow-bk-hover transition-all group">
          <div class="flex items-center gap-3 min-w-0">
            ${c.imageUrl
              ? `<img src="${escapeAttr(c.imageUrl)}" alt="${escapeAttr(c.title)}" class="w-10 h-10 rounded-xl object-cover shrink-0 border border-slate-200/60 dark:border-zinc-700" />`
              : `<div class="w-10 h-10 rounded-xl flex items-center justify-center text-white font-extrabold text-xs shrink-0" style="background:${escapeAttr(c.bg || '#2563eb')}">${escapeHtml(c.initials || c.title.slice(0,2).toUpperCase())}</div>`}
            <div class="min-w-0">
              <div class="text-xs font-bold text-slate-900 dark:text-white truncate group-hover:text-blue-600 dark:group-hover:text-blue-400">${escapeHtml(c.title)}</div>
              <div class="text-[11px] text-slate-500 dark:text-zinc-400 truncate">${escapeHtml(c.desc)}</div>
            </div>
          </div>
          <span class="w-7 h-7 rounded-lg bg-[#f7f9fc] dark:bg-zinc-800 border border-slate-200/70 dark:border-zinc-700 flex items-center justify-center text-slate-500 shrink-0 group-hover:bg-slate-900 group-hover:text-white dark:group-hover:bg-white dark:group-hover:text-slate-900 transition-colors">${SVG.arrowUpRight}</span>
        </a>
      `).join('');

      const comm = state.settings.communityCard;
      return `
        <aside class="space-y-4 lg:sticky lg:top-20 lg:self-start">
          ${adsHtml}
          <div class="space-y-2.5">${promoCardsHtml}</div>
          ${extraDetailWidgets}
          <div class="rounded-2xl bg-white dark:bg-zinc-900 border border-slate-200/70 dark:border-zinc-800 p-4 shadow-bk">
            <div class="text-sm font-bold text-slate-900 dark:text-white mb-1">${escapeHtml(comm.title)}</div>
            <p class="text-xs text-slate-500 dark:text-zinc-400 mb-3">${escapeHtml(comm.subtitle)}</p>
            <a href="${escapeAttr(comm.ctaUrl)}" target="_blank" rel="noopener" class="w-full inline-flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 dark:bg-white dark:hover:bg-zinc-200 text-white dark:text-slate-900 text-xs font-bold transition-colors">
              <span>${escapeHtml(comm.ctaText)}</span> ${SVG.arrowUpRight}
            </a>
          </div>
        </aside>
      `;
    }

    function renderTopBanners() {
      const activeBanners = (state.ads.topBanners || []).filter(b => b.active);
      if (!activeBanners.length) return '';
      return `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5 mb-6">
          ${activeBanners.map(b => {
            const hasHtml = b.htmlCode && b.htmlCode.trim();
            const hasMedia = b.imageUrl && b.imageUrl.trim();
            const isVid = hasMedia && (b.isVideo || /\.(mp4|webm|ogg)(\?|$)/i.test(b.imageUrl) || b.imageUrl.startsWith('data:video/'));
            return `
              <a href="${escapeAttr(b.url || '#')}" target="_blank" rel="noopener" class="relative block h-20 sm:h-24 overflow-hidden rounded-2xl bg-gradient-to-r ${escapeAttr(b.gradient || 'from-blue-600 to-indigo-600')} shadow-bk hover:shadow-bk-hover transition-all group">
                ${hasHtml ? `<div class="w-full h-full overflow-hidden">${b.htmlCode}</div>` : ''}
                ${!hasHtml && hasMedia ? (
                  isVid
                    ? `<video src="${escapeAttr(b.imageUrl)}" autoplay loop muted playsinline class="w-full h-full object-cover block"></video>`
                    : `<img src="${escapeAttr(b.imageUrl)}" alt="${escapeAttr(b.badge || 'Ad')}" class="w-full h-full object-cover block" />`
                ) : ''}
                <span class="absolute top-2 left-2.5 px-2 py-0.5 rounded-md text-[9px] font-bold tracking-wider uppercase bg-slate-900/65 text-white backdrop-blur-xs">${escapeHtml(b.badge || 'SPONSORED')}</span>
                <span class="absolute right-3 top-1/2 -translate-y-1/2 inline-flex items-center gap-1 px-3.5 py-1.5 rounded-xl bg-white/90 hover:bg-white text-slate-900 text-xs font-bold shadow-xs transition-transform group-hover:scale-105">Open ${SVG.arrowUpRight}</span>
              </a>
            `;
          }).join('')}
        </div>
      `;
    }

    // =========================================================================
    // AIRDROPS & PERPS PAGE (Bullkarry Simplicity + AlphaDrops Flow)
    // =========================================================================
    function renderProjectCard(item) {
      return `
        <div onclick="navigateTo('detail', '${item.id}')" class="group cursor-pointer rounded-2xl bg-white dark:bg-zinc-900 border border-slate-200/70 dark:border-zinc-800 p-4 shadow-bk hover:-translate-y-1 hover:shadow-bk-hover hover:border-blue-300/80 dark:hover:border-blue-500/40 transition-all duration-200 flex flex-col justify-between min-w-0">
          <div class="min-w-0">
            <div class="flex items-start justify-between gap-2 mb-3">
              <div class="flex items-center gap-3 min-w-0">
                ${renderLogo(item)}
                <div class="min-w-0">
                  <h3 class="font-bold text-sm text-slate-900 dark:text-white truncate group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors">${escapeHtml(item.name)}</h3>
                  <div class="text-[11px] text-slate-400 dark:text-zinc-400 truncate">${escapeHtml(item.chain)}${item.chainsExtra ? ' ' + escapeHtml(item.chainsExtra) : ''}</div>
                </div>

              <div class="shrink-0">${getStatusBadge(item.status)}</div>
            </div>
            <p class="text-xs text-slate-500 dark:text-zinc-300 line-clamp-2 mb-3 leading-relaxed">${escapeHtml(item.shortDesc)}</p>
            <div class="flex flex-wrap gap-1.5 mb-3">${item.tags.map(t => getTagBadge(t)).join('')}</div>
          </div>
          <div class="pt-3 border-t border-slate-100 dark:border-zinc-800 flex flex-wrap items-center justify-between gap-2">
            <div class="text-[11px] text-slate-400 dark:text-zinc-400 truncate min-w-0">
              Funding: <span class="font-semibold text-slate-700 dark:text-zinc-200">${escapeHtml(item.funding || 'Undisclosed')}</span>
            </div>
            <div class="flex items-center gap-1.5 shrink-0" onclick="event.stopPropagation()">
              <button onclick="navigateTo('detail', '${item.id}')" class="px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 dark:bg-zinc-800 dark:hover:bg-zinc-700 text-[11px] font-semibold text-slate-700 dark:text-zinc-200 transition-colors">Details</button>
              <a href="${escapeAttr(item.joinUrl)}" target="_blank" rel="noopener" class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 dark:bg-white dark:text-slate-900 text-white text-[11px] font-semibold transition-colors">Join ${SVG.arrowUpRight}</a>
            </div>
          </div>
        </div>
      `;
    }

    function renderHomePage() {
      const featured = state.airdrops.filter(a => a.featured);
      const activeThree = state.airdrops.filter(a => a.status === 'Active').slice(0, 3);
      const activeCount = state.airdrops.filter(a => a.status === 'Active').length;
      const endedCount = state.airdrops.filter(a => a.status === 'Ended').length;
      const claimCount = state.airdrops.filter(a => a.status === 'Claimable').length;

      return `
        <div class="space-y-7 animate-fade-up">
          ${renderDailyNotification()}
          <!-- 1. Hero + Top Featured Slider -->
          <section>
            <div class="rounded-3xl bg-gradient-to-br from-white via-white to-blue-50/70 dark:from-zinc-900 dark:via-zinc-900 dark:to-blue-950/20 border border-slate-200/70 dark:border-zinc-800 p-6 sm:p-8 shadow-bk mb-6 text-center">
              <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight text-slate-900 dark:text-white mb-2">${escapeHtml(state.settings.heroTitle)}</h1>
              <p class="text-sm sm:text-base text-slate-500 dark:text-zinc-400 max-w-xl mx-auto">${escapeHtml(state.settings.heroSubtitle)}</p>
            </div>

            <div class="relative">
              <div id="featuredCarousel" class="flex gap-3.5 overflow-x-auto no-scrollbar scroll-smooth pb-2">
                ${featured.map((item, idx) => `
                  <div onclick="navigateTo('detail', '${item.id}')" class="min-w-[225px] sm:min-w-[240px] flex-1 rounded-2xl border p-4 cursor-pointer transition-all hover:-translate-y-0.5 shadow-bk hover:shadow-bk-hover flex flex-col justify-between ${getTintClasses(item.cardTint)}">
                    <div>
                      <div class="flex items-center justify-between mb-4">
                        <span class="text-xs font-bold text-slate-400 dark:text-zinc-400">${String(idx + 1).padStart(2, '0')}</span>
                        ${getStatusBadge(item.status)}
                      </div>
                      <div class="mb-4">${renderLogo(item, 'w-12 h-12 text-base')}</div>
                      <h3 class="font-bold text-base text-slate-900 dark:text-white mb-0.5">${escapeHtml(item.name)}</h3>
                      <p class="text-xs text-slate-500 dark:text-zinc-400 mb-4">${escapeHtml(item.category)} • ${escapeHtml(item.chain)}</p>
                    </div>
                    <div class="flex items-center justify-between pt-2.5 border-t border-slate-900/10 dark:border-white/10">
                      <span class="text-[11px] font-bold tracking-wider uppercase text-slate-700 dark:text-zinc-200">VIEW TASKS</span>
                      <span class="w-7 h-7 rounded-full bg-slate-900 dark:bg-white text-white dark:text-slate-900 flex items-center justify-center">${SVG.arrowUpRight}</span>
                    </div>
                  </div>
                `).join('')}
              </div>
              <div class="flex items-center justify-center gap-2 mt-3">
                <button onclick="slideCarousel(-1)" class="w-8 h-8 rounded-full bg-white dark:bg-zinc-800 border border-slate-200/80 dark:border-zinc-700 flex items-center justify-center text-slate-600 dark:text-zinc-300 hover:bg-slate-50 dark:hover:bg-zinc-700 shadow-xs" aria-label="Previous">${SVG.arrowLeft}</button>
                <button onclick="slideCarousel(1)" class="w-8 h-8 rounded-full bg-white dark:bg-zinc-800 border border-slate-200/80 dark:border-zinc-700 flex items-center justify-center text-slate-600 dark:text-zinc-300 hover:bg-slate-50 dark:hover:bg-zinc-700 shadow-xs" aria-label="Next">${SVG.arrowRight}</button>
              </div>
            </div>
          </section>

          <!-- 2. Animated Rolling Stats Row -->
          <section id="homeStatsRow" class="grid grid-cols-2 sm:grid-cols-4 gap-3.5 max-w-4xl mx-auto text-center">
            <div class="rounded-2xl bg-white dark:bg-zinc-900 border border-slate-200/70 dark:border-zinc-800 p-5 shadow-bk hover:-translate-y-0.5 transition-transform">
              <div data-count="${activeCount}" class="stat-num text-3xl sm:text-4xl font-extrabold bg-gradient-to-r from-slate-900 to-blue-600 dark:from-white dark:to-blue-400 bg-clip-text text-transparent">0</div>
              <div class="text-xs font-semibold text-slate-400 mt-1">Active Airdrops</div>
            </div>
            <div class="rounded-2xl bg-white dark:bg-zinc-900 border border-slate-200/70 dark:border-zinc-800 p-5 shadow-bk hover:-translate-y-0.5 transition-transform">
              <div data-count="${endedCount}" class="stat-num text-3xl sm:text-4xl font-extrabold bg-gradient-to-r from-slate-900 to-slate-500 dark:from-white dark:to-zinc-400 bg-clip-text text-transparent">0</div>
              <div class="text-xs font-semibold text-slate-400 mt-1">Ended Airdrops</div>
            </div>
            <div class="rounded-2xl bg-white dark:bg-zinc-900 border border-slate-200/70 dark:border-zinc-800 p-5 shadow-bk hover:-translate-y-0.5 transition-transform">
              <div data-count="${claimCount}" class="stat-num text-3xl sm:text-4xl font-extrabold bg-gradient-to-r from-slate-900 to-emerald-600 dark:from-white dark:to-emerald-400 bg-clip-text text-transparent">0</div>
              <div class="text-xs font-semibold text-slate-400 mt-1">Claimable Now</div>

            <div class="rounded-2xl bg-white dark:bg-zinc-900 border border-slate-200/70 dark:border-zinc-800 p-5 shadow-bk hover:-translate-y-0.5 transition-transform">
              <div data-stat-text="${escapeAttr(state.settings.communityStat || '80K+')}" class="stat-text-num text-3xl sm:text-4xl font-extrabold bg-gradient-to-r from-amber-500 to-rose-500 bg-clip-text text-transparent">0</div>
              <div class="text-xs font-semibold text-slate-400 mt-1">Community</div>

    function animateHomeStats() {
      const row = document.getElementById('homeStatsRow');
      if (!row) return;
      let ran = false;
      const runAnim = () => {
        if (ran) return;
        ran = true;
        const duration = 2200;
        const start = performance.now();
        const numEls = row.querySelectorAll('.stat-num');
        const textEls = row.querySelectorAll('.stat-text-num');
        function tick(now) {
          const t = Math.min(1, (now - start) / duration);
          const ease = 1 - Math.pow(1 - t, 3);
          numEls.forEach(el => {
            const target = parseInt(el.getAttribute('data-count') || '0', 10);
            el.textContent = Math.round(target * ease);
          });
          textEls.forEach(el => {
            const raw = el.getAttribute('data-stat-text') || '80K+';
            const m = raw.match(/^(\d+)(.*)$/);
            if (m) {
              const target = parseInt(m[1], 10);
              el.textContent = Math.round(target * ease) + m[2];
            } else {
              el.textContent = raw;
            }
          });
          if (t < 1) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      };
      if ('IntersectionObserver' in window) {
        const obs = new IntersectionObserver((entries) => {
          if (entries.some(e => e.isIntersecting)) { runAnim(); obs.disconnect(); }
        }, { threshold: 0.2 });
        obs.observe(row);
      } else {
        runAnim();
      }
    }

      { id: 'txflow', name: 'TxFlow', logoBg: '#16a34a', logoText: 'TX', feeBps: 5.0, makerBps: 2.0, fdvM: 250, airdropPct: 12, latestPts: '80m', joinUrl: 'https://alphadrops.net/airdrops/txflow' }
    ];
    let calcProtoId = 'arcus';
    let calcModeTab = 'pointValue';
    let calcFdvUnit = 'M';
    let calcState = { fdv: '100', yourPts: '0', alloc: '10', totalPts: '13m' };
    let lastCalcResult = { ptVal: 0.769231, sharePct: 0, estVal: 0, fdvDisplay: '$100.0M', pool: 10000000, totalPtsNum: 13000000, yourPts: 0, allocPct: 10 };

    function parseCompactNum(v) {
      const s = String(v || '').trim().toLowerCase().replace(/,/g, '');
      if (s.endsWith('b')) return parseFloat(s) * 1e9 || 0;
      if (s.endsWith('m')) return parseFloat(s) * 1e6 || 0;
      if (s.endsWith('k')) return parseFloat(s) * 1e3 || 0;
      return parseFloat(s) || 0;
    }

    function selectCalcProto(id) {
      calcProtoId = id;
      const pr = PERP_PROTOCOLS.find(x => x.id === id) || PERP_PROTOCOLS[0];
      calcFdvUnit = 'M';
      calcState.fdv = String(pr.fdvM);
      calcState.alloc = String(pr.airdropPct);
      calcState.totalPts = pr.latestPts;
      const host = document.getElementById('perpCalcHost');
      if (host) { host.innerHTML = renderPerpCalculatorInner(); calcPerp(); }
      else renderMain();
    }

    function setCalcTab(tab) {
      calcModeTab = tab;
      const host = document.getElementById('perpCalcHost');
      if (host) { host.innerHTML = renderPerpCalculatorInner(); calcPerp(); }
      else renderMain();
    }

    function setCalcFdvUnit(unit) {
      calcFdvUnit = unit;
      const host = document.getElementById('perpCalcHost');
      if (host) { host.innerHTML = renderPerpCalculatorInner(); calcPerp(); }
    }

    function useLatestTotalPts() {
      const pr = PERP_PROTOCOLS.find(x => x.id === calcProtoId) || PERP_PROTOCOLS[0];
      calcState.totalPts = pr.latestPts;
      const el = document.getElementById('pvTotalPts');
      if (el) el.value = pr.latestPts;
      calcPerp();
    }

    function renderPerpCalculatorPage() {
      return `
        <div class="space-y-5 animate-fade-up">
          <button onclick="navigateTo('checkers')" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-500 hover:text-slate-900 dark:text-zinc-400 dark:hover:text-white">
            ${SVG.arrowLeft} <span>Back to Checkers</span>
          </button>
          <div>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white">Perp Calculator</h1>
            <p class="text-sm text-slate-500 dark:text-zinc-400">Estimate points value, trading fees, and farming efficiency.</p>
          </div>
          ${renderPerpCalculatorCard()}
        </div>
      `;
    }

    function renderPerpCalculatorCard() {
      return `<div id="perpCalcHost">${renderPerpCalculatorInner()}</div>`;
    }

    function renderPerpCalculatorInner() {
      const pr = PERP_PROTOCOLS.find(x => x.id === calcProtoId) || PERP_PROTOCOLS[0];
      return `
        <div class="rounded-2xl bg-white dark:bg-zinc-900 border border-slate-200/70 dark:border-zinc-800 p-5 sm:p-6 shadow-bk space-y-5">
          <div>
            <div class="text-xs font-bold text-slate-500 dark:text-zinc-400 mb-2.5">Protocol</div>
            <div class="flex flex-wrap gap-2">
              ${PERP_PROTOCOLS.map(p => {
                const active = p.id === calcProtoId;
                const matched = state.airdrops.find(a => a.id === p.id);
                const iconHtml = matched && matched.logoUrl
                  ? `<img src="${escapeAttr(matched.logoUrl)}" alt="${escapeAttr(p.name)}" class="w-6 h-6 rounded-md object-cover shrink-0" />`
                  : `<span class="w-6 h-6 rounded-md text-white font-extrabold text-[9px] flex items-center justify-center shrink-0" style="background:${p.logoBg}">${p.logoText}</span>`;
                return `
                  <button type="button" onclick="selectCalcProto('${p.id}')" class="inline-flex items-center gap-2 px-3 py-2 rounded-xl border text-xs font-bold transition-all ${active ? 'bg-amber-50 border-amber-500 text-amber-700 dark:bg-amber-500/15 dark:border-amber-500 dark:text-amber-300 shadow-xs' : 'bg-[#f7f9fc] dark:bg-zinc-800/60 border-slate-200/70 dark:border-zinc-700 hover:border-slate-300 text-slate-700 dark:text-zinc-200'}">
                    ${iconHtml}
                    <span>${escapeHtml(p.name)}</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <div class="flex flex-wrap gap-4 border-b border-slate-100 dark:border-zinc-800 pb-2.5">
            <button type="button" onclick="setCalcTab('pointValue')" class="pb-1.5 text-xs font-bold border-b-2 transition-colors ${calcModeTab==='pointValue' ? 'border-amber-500 text-slate-900 dark:text-white' : 'border-transparent text-slate-400 hover:text-slate-700'}">Points value</button>
            <button type="button" onclick="setCalcTab('tradingFees')" class="pb-1.5 text-xs font-bold border-b-2 transition-colors ${calcModeTab==='tradingFees' ? 'border-amber-500 text-slate-900 dark:text-white' : 'border-transparent text-slate-400 hover:text-slate-700'}">Trading fees</button>
            <button type="button" onclick="setCalcTab('efficiency')" class="pb-1.5 text-xs font-bold border-b-2 transition-colors ${calcModeTab==='efficiency' ? 'border-amber-500 text-slate-900 dark:text-white' : 'border-transparent text-slate-400 hover:text-slate-700'}">Farming efficiency</button>
          </div>

          ${calcModeTab === 'pointValue' ? `
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">
              <div class="space-y-4">
                <div>
                  <h4 class="text-base font-extrabold text-slate-900 dark:text-white">Assumptions</h4>
                  <p class="text-xs text-slate-400">Adjust the inputs to model your potential allocation.</p>
                </div>
                <div>
                  <label class="block text-xs font-semibold mb-1.5">Expected FDV</label>
                  <div class="flex gap-2">
                    <div class="relative flex-1">
                      <span class="absolute left-3.5 top-2.5 text-sm font-bold text-slate-400">$</span>
                      <input id="pvFdv" type="number" value="${escapeAttr(calcState.fdv)}" oninput="calcState.fdv=this.value; calcPerp();" class="w-full pl-7 pr-3 py-2.5 rounded-xl bg-[#f7f9fc] dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 text-sm font-bold" />
                    </div>
                    <div class="inline-flex rounded-xl bg-[#f7f9fc] dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 p-1">
                      <button type="button" onclick="setCalcFdvUnit('M')" class="px-3.5 py-1.5 rounded-lg text-xs font-extrabold ${calcFdvUnit==='M' ? 'bg-slate-900 text-white dark:bg-white dark:text-slate-900' : 'text-slate-400'}">M</button>
                      <button type="button" onclick="setCalcFdvUnit('B')" class="px-3.5 py-1.5 rounded-lg text-xs font-extrabold ${calcFdvUnit==='B' ? 'bg-slate-900 text-white dark:bg-white dark:text-slate-900' : 'text-slate-400'}">B</button>
                    </div>
                  </div>
                </div>
                <div>
                  <label class="block text-xs font-semibold mb-1.5">Your points</label>
                  <input id="pvPts" type="number" value="${escapeAttr(calcState.yourPts)}" oninput="calcState.yourPts=this.value; calcPerp();" class="w-full px-3.5 py-2.5 rounded-xl bg-[#f7f9fc] dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 text-sm font-bold" />
                </div>
                <div class="grid grid-cols-2 gap-3">
                  <div>
                    <label class="block text-xs font-semibold mb-1.5">Airdrop allocation (%)</label>
                    <input id="pvPct" type="number" value="${escapeAttr(calcState.alloc)}" oninput="calcState.alloc=this.value; calcPerp();" class="w-full px-3.5 py-2.5 rounded-xl bg-[#f7f9fc] dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 text-sm font-bold" />
                  </div>
                  <div>
                    <div class="flex items-center justify-between mb-1.5">
                      <label class="text-xs font-semibold">Total points</label>
                      <button type="button" onclick="useLatestTotalPts()" class="text-[11px] font-bold text-amber-500 hover:underline">Use latest</button>
                    </div>
                    <input id="pvTotalPts" type="text" value="${escapeAttr(calcState.totalPts)}" oninput="calcState.totalPts=this.value; calcPerp();" placeholder="e.g. 13m" class="w-full px-3.5 py-2.5 rounded-xl bg-[#f7f9fc] dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 text-sm font-bold" />
                  </div>
                </div>
                <div class="flex flex-wrap gap-2.5 pt-2">
                  <button type="button" onclick="openShareCalcModal()" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 text-xs font-bold shadow-xs hover:opacity-90">${SVG.share} Share</button>
                  <a href="${escapeAttr(pr.joinUrl)}" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 px-5 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold shadow-xs">Join ${escapeHtml(pr.name)} ${SVG.arrowRight}</a>
                </div>
              </div>
              <div id="pcOutput" class="rounded-2xl bg-[#f7f9fc] dark:bg-zinc-800/50 border border-slate-200/70 dark:border-zinc-800 p-5 sm:p-6 space-y-4"></div>
            </div>
          ` : calcModeTab === 'tradingFees' ? `
            <div class="space-y-4">
              <div class="grid grid-cols-1 sm:grid-cols-4 gap-3.5 text-xs">
                <div><label class="font-semibold block mb-1">Margin (USDC)</label><input id="tfCap" type="number" value="2500" oninput="calcPerp()" class="w-full px-3 py-2 rounded-xl bg-[#f7f9fc] dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 text-sm font-bold" /></div>
                <div><label class="font-semibold block mb-1">Leverage (<span id="tfLevVal">10</span>x)</label><input id="tfLev" type="range" min="1" max="50" value="10" oninput="document.getElementById('tfLevVal').textContent=this.value; calcPerp();" class="w-full mt-2 accent-blue-600" /></div>
                <div><label class="font-semibold block mb-1">Trades / Week</label><input id="tfTrades" type="number" value="15" oninput="calcPerp()" class="w-full px-3 py-2 rounded-xl bg-[#f7f9fc] dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 text-sm font-bold" /></div>
                <div><label class="font-semibold block mb-1">Order Type</label><select id="tfOrder" onchange="calcPerp()" class="w-full px-3 py-2 rounded-xl bg-[#f7f9fc] dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 text-sm font-bold"><option value="taker">Taker (${pr.feeBps} bps)</option><option value="maker">Maker (${pr.makerBps} bps)</option></select></div>
              </div>
              <div id="pcOutput" class="grid grid-cols-2 sm:grid-cols-4 gap-3"></div>
            </div>
          ` : `
            <div class="space-y-4">
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3.5 text-xs">
                <div><label class="font-semibold block mb-1">Total Volume ($)</label><input id="efVol" type="number" value="250000" oninput="calcPerp()" class="w-full px-3 py-2 rounded-xl bg-[#f7f9fc] dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 text-sm font-bold" /></div>
                <div><label class="font-semibold block mb-1">Fees Paid ($)</label><input id="efFees" type="number" value="112" oninput="calcPerp()" class="w-full px-3 py-2 rounded-xl bg-[#f7f9fc] dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 text-sm font-bold" /></div>
                <div><label class="font-semibold block mb-1">Points Earned</label><input id="efPts" type="number" value="3000" oninput="calcPerp()" class="w-full px-3 py-2 rounded-xl bg-[#f7f9fc] dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 text-sm font-bold" /></div>
              </div>
              <div id="pcOutput" class="grid grid-cols-2 sm:grid-cols-4 gap-3"></div>
            </div>
          `}
        </div>
      `;
    }

    function calcPerp() {
      const pr = PERP_PROTOCOLS.find(x => x.id === calcProtoId) || PERP_PROTOCOLS[0];
      const out = document.getElementById('pcOutput');
      if (!out) return;

      if (calcModeTab === 'pointValue') {
        const fdvRaw = Math.max(0, Number(calcState.fdv || 0));
        const fdvUsd = fdvRaw * (calcFdvUnit === 'B' ? 1e9 : 1e6);
        const yourPts = Math.max(0, Number(calcState.yourPts || 0));
        const allocPct = Math.max(0, Number(calcState.alloc || 0));
        const totalPtsNum = Math.max(1, parseCompactNum(calcState.totalPts || pr.latestPts));
        const poolUsd = fdvUsd * (allocPct / 100);
        const ptVal = poolUsd / totalPtsNum;
        const sharePct = (yourPts / totalPtsNum) * 100;
        const estVal = yourPts * ptVal;
        const fdvDisplay = '$' + fdvRaw.toFixed(1) + calcFdvUnit;

        lastCalcResult = { ptVal, sharePct, estVal, fdvDisplay, pool: poolUsd, totalPtsNum, yourPts, allocPct };

        const headlineLabel = yourPts > 0 ? `Your ${yourPts.toLocaleString()} ${pr.name} points could be worth` : `Each ${pr.name} point could be worth`;
        const headlineNum = yourPts > 0 ? '$' + estVal.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '$' + ptVal.toFixed(6);

        out.innerHTML = `
          <div>
            <div class="text-xs font-bold text-amber-500 mb-1">${escapeHtml(headlineLabel)}</div>
            <div class="text-3xl sm:text-4xl font-extrabold tracking-tight text-slate-900 dark:text-white">${headlineNum}</div>
            <div class="text-[11px] text-slate-400 mt-1">${yourPts > 0 ? 'Based on proportional share of modeled airdrop pool.' : 'Enter your points on the left to see what your allocation could be worth.'}</div>
          </div>
          <div class="grid grid-cols-2 gap-3 pt-3 border-t border-slate-200/70 dark:border-zinc-700/70">
            <div><div class="text-[11px] text-slate-400">Point value</div><div class="text-base font-extrabold text-slate-900 dark:text-white">$${ptVal.toFixed(6)}</div></div>
            <div><div class="text-[11px] text-slate-400">Your share</div><div class="text-base font-extrabold text-slate-900 dark:text-white">${sharePct.toFixed(4)}%</div></div>
          </div>
          <div class="space-y-2 pt-3 border-t border-slate-200/70 dark:border-zinc-700/70 text-xs">
            <div class="flex justify-between"><span class="text-slate-400">Expected FDV</span><span class="font-bold">${fdvDisplay}</span></div>
            <div class="flex justify-between"><span class="text-slate-400">Allocation to points</span><span class="font-bold">${allocPct}%</span></div>
            <div class="flex justify-between"><span class="text-slate-400">Modeled airdrop pool</span><span class="font-bold">$${Math.round(poolUsd).toLocaleString()}</span></div>
            <div class="flex justify-between"><span class="text-slate-400">Total points</span><span class="font-bold">${Math.round(totalPtsNum).toLocaleString()}</span></div>
          </div>
        `;
      } else if (calcModeTab === 'tradingFees') {
        const cap = Math.max(0, Number(document.getElementById('tfCap')?.value || 0));
        const lev = Math.max(1, Number(document.getElementById('tfLev')?.value || 1));
        const tr = Math.max(0, Number(document.getElementById('tfTrades')?.value || 0));
        const ord = document.getElementById('tfOrder')?.value || 'taker';
        const bps = ord === 'maker' ? pr.makerBps : pr.feeBps;
        const wkVol = cap * lev * tr;
        const wkFee = wkVol * (bps / 10000);
        out.innerHTML = `
          <div class="p-3.5 rounded-xl bg-[#f7f9fc] dark:bg-zinc-800/70 border border-slate-200/60 dark:border-zinc-700"><div class="text-[11px] text-slate-400">Weekly Volume</div><div class="text-base font-extrabold">$${wkVol.toLocaleString()}</div></div>
          <div class="p-3.5 rounded-xl bg-[#f7f9fc] dark:bg-zinc-800/70 border border-slate-200/60 dark:border-zinc-700"><div class="text-[11px] text-slate-400">Fee Rate</div><div class="text-base font-extrabold">${bps} bps</div></div>
          <div class="p-3.5 rounded-xl bg-[#f7f9fc] dark:bg-zinc-800/70 border border-slate-200/60 dark:border-zinc-700"><div class="text-[11px] text-slate-400">Weekly Fees</div><div class="text-base font-extrabold text-amber-600">$${wkFee.toFixed(2)}</div></div>
          <div class="p-3.5 rounded-xl bg-[#f7f9fc] dark:bg-zinc-800/70 border border-slate-200/60 dark:border-zinc-700"><div class="text-[11px] text-slate-400">Monthly Fees</div><div class="text-base font-extrabold text-blue-600">$${(wkFee*4).toFixed(2)}</div></div>
        `;
      } else {
        const vol = Math.max(1, Number(document.getElementById('efVol')?.value || 1));
        const fees = Math.max(0.01, Number(document.getElementById('efFees')?.value || 1));
        const pts = Math.max(0, Number(document.getElementById('efPts')?.value || 0));
        const costPerPt = pts > 0 ? fees / pts : 0;
        const ptsPerFee = pts / fees;
        const roi = ((pts * lastCalcResult.ptVal) / fees).toFixed(2);
        out.innerHTML = `
          <div class="p-3.5 rounded-xl bg-[#f7f9fc] dark:bg-zinc-800/70 border border-slate-200/60 dark:border-zinc-700"><div class="text-[11px] text-slate-400">Cost / Point</div><div class="text-base font-extrabold text-amber-600">$${costPerPt.toFixed(4)}</div></div>
          <div class="p-3.5 rounded-xl bg-[#f7f9fc] dark:bg-zinc-800/70 border border-slate-200/60 dark:border-zinc-700"><div class="text-[11px] text-slate-400">Points / $1 Fee</div><div class="text-base font-extrabold text-blue-600">${ptsPerFee.toFixed(1)} pts</div></div>
          <div class="p-3.5 rounded-xl bg-[#f7f9fc] dark:bg-zinc-800/70 border border-slate-200/60 dark:border-zinc-700"><div class="text-[11px] text-slate-400">Est. ROI Multiplier</div><div class="text-base font-extrabold text-emerald-600">${roi}x</div></div>
          <div class="p-3.5 rounded-xl bg-[#f7f9fc] dark:bg-zinc-800/70 border border-slate-200/60 dark:border-zinc-700"><div class="text-[11px] text-slate-400">Efficiency</div><div class="text-base font-extrabold">${Number(roi) >= 2 ? 'High' : Number(roi) >= 1 ? 'Medium' : 'Low'}</div></div>
        `;
      }
    }

    function openShareCalcModal() {
      const pr = PERP_PROTOCOLS.find(x => x.id === calcProtoId) || PERP_PROTOCOLS[0];
      const r = lastCalcResult;
      const valStr = r.yourPts > 0 ? '$' + r.estVal.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '$' + r.ptVal.toFixed(4);
      openModal(`
        <div class="w-full max-w-md rounded-2xl bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 p-5 shadow-2xl space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-sm font-extrabold inline-flex items-center gap-2">${SVG.share} Share Calculator Results</h3>
            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700">${SVG.close}</button>
          </div>
          <div class="rounded-2xl bg-gradient-to-br from-slate-900 via-zinc-900 to-emerald-950 text-white p-5 border border-zinc-800 space-y-4">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <span class="w-7 h-7 rounded-lg text-white font-extrabold text-[10px] flex items-center justify-center" style="background:${pr.logoBg}">${pr.logoText}</span>
                <span class="font-extrabold text-sm">${escapeHtml(pr.name)}</span>
              </div>
              <div class="text-right"><div class="text-[10px] text-zinc-400">1 point =</div><div class="text-xs font-bold text-emerald-400">$${r.ptVal.toFixed(4)}</div></div>
            </div>
            <div class="text-center py-2">
              <div class="text-[10px] tracking-widest uppercase text-zinc-400 mb-1">ESTIMATED AIRDROP</div>
              <div class="text-3xl font-extrabold text-emerald-400">${valStr}</div>
            </div>
            <div class="grid grid-cols-3 gap-2 text-center">
              <div class="rounded-xl bg-white/5 p-2"><div class="text-[9px] text-zinc-400">POINTS</div><div class="text-xs font-bold">${r.yourPts.toLocaleString()}</div></div>
              <div class="rounded-xl bg-white/5 p-2"><div class="text-[9px] text-zinc-400">FDV</div><div class="text-xs font-bold">${r.fdvDisplay}</div></div>
              <div class="rounded-xl bg-white/5 p-2"><div class="text-[9px] text-zinc-400">AIRDROP %</div><div class="text-xs font-bold">${r.allocPct}%</div></div>
            </div>
            <div class="flex items-center justify-between text-[10px] text-zinc-400 pt-1">
              <span>Made with ${escapeHtml(state.settings.brandName || 'Bullkarry')}</span>
              <span>Perp Calculator</span>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2 text-xs">
            <button onclick="downloadCalcCardPng()" class="py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-bold">Save Image</button>
            <button onclick="copyShareLink()" class="py-2.5 rounded-xl bg-slate-100 dark:bg-zinc-800 font-bold">Copy Link</button>
          </div>
        </div>
      `);
    }

    function downloadCalcCardPng() {
      const pr = PERP_PROTOCOLS.find(x => x.id === calcProtoId) || PERP_PROTOCOLS[0];
      const r = lastCalcResult;
      const canvas = document.createElement('canvas');
      canvas.width = 800; canvas.height = 440;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#09090b'; ctx.fillRect(0, 0, 800, 440);
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 28px Inter, sans-serif';
      ctx.fillText(pr.name + ' — Estimated Airdrop', 48, 72);
      ctx.fillStyle = '#34d399'; ctx.font = 'bold 64px Inter, sans-serif';
      const valStr = r.yourPts > 0 ? '$' + r.estVal.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '$' + r.ptVal.toFixed(4);
      ctx.fillText(valStr, 48, 200);
      ctx.fillStyle = '#a1a1aa'; ctx.font = '20px Inter, sans-serif';
      ctx.fillText(`Points: ${r.yourPts.toLocaleString()}   |   FDV: ${r.fdvDisplay}   |   Pool: ${r.allocPct}%   |   1 pt = $${r.ptVal.toFixed(4)}`, 48, 290);

      const a = document.createElement('a');
      a.download = `${pr.id}-airdrop-estimate.png`;
      a.href = canvas.toDataURL('image/png');
      a.click();
      showToast('Result image downloaded!');

    let pendingOtp = null;
    function openForgotPassword() {
      openModal(`
        <div class="w-full max-w-sm rounded-2xl bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 p-6 shadow-xl space-y-3">

          <input id="resetEmailIn" type="email" placeholder="Enter admin email..." class="w-full px-3.5 py-2.5 rounded-xl bg-[#f7f9fc] dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 text-xs" />
          <div id="resetStep2" class="hidden space-y-2.5">
            <div id="resetOtpHint" class="p-2.5 rounded-xl bg-blue-50 dark:bg-blue-500/15 text-blue-700 dark:text-blue-300 text-xs font-semibold"></div>
            <input id="resetOtpIn" type="text" placeholder="Enter 6-digit code" class="w-full px-3.5 py-2 rounded-xl bg-[#f7f9fc] dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 text-xs" />
            <input id="resetNewPassIn" type="password" placeholder="Enter new password" class="w-full px-3.5 py-2 rounded-xl bg-[#f7f9fc] dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 text-xs" />
            <button onclick="completePasswordReset()" class="w-full py-2.5 rounded-xl bg-emerald-600 text-white text-xs font-bold">Verify & Reset Password</button>
          </div>
          <button id="sendOtpBtn" onclick="sendResetOtp()" class="w-full py-2.5 rounded-xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 text-xs font-bold">Send Reset Code</button>
        </div>
      `);
    }
    function sendResetOtp() {
      const email = (document.getElementById('resetEmailIn')?.value || '').trim().toLowerCase();
      const target = (state.settings.adminEmail || 'admin@bullkarry.com').trim().toLowerCase();
      if (email !== target) return showToast('Email does not match registered admin email');
      pendingOtp = String(Math.floor(100000 + Math.random() * 900000));
      document.getElementById('resetOtpHint').textContent = `Verification code sent to ${email}: ${pendingOtp}`;
      document.getElementById('resetStep2').classList.remove('hidden');
      document.getElementById('sendOtpBtn').classList.add('hidden');
    }
    function completePasswordReset() {
      const otp = document.getElementById('resetOtpIn')?.value.trim();
      const np = document.getElementById('resetNewPassIn')?.value.trim();
      if (otp !== pendingOtp) return showToast('Invalid verification code');
      if (!np || np.length < 4) return showToast('Password must be at least 4 characters');
      state.settings.adminPassword = np;
      saveState(); adminUnlocked = true; openAdminModal();
      showToast('Password reset successfully!');
    }
    function toggleDraftTag(tg) {

    function verifyAdminPass() {
      const val = document.getElementById('adminPassInput')?.value || '';

                    <textarea rows="2" onchange="state.ads.topBanners[${i}].htmlCode=this.value; saveState(); renderMain();" placeholder="Optional Custom HTML Ad Code (overrides image if filled)" class="w-full px-2.5 py-2 rounded-lg bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-700 font-mono text-[11px]">${escapeHtml(b.htmlCode || '')}</textarea>

                ${(state.ads.sidebarAds || []).map((ad, i) => `
                  <div class="p-3.5 rounded-xl bg-[#f7f9fc] dark:bg-zinc-800/60 border border-slate-200 dark:border-zinc-700 space-y-2 text-xs">
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                      <input type="text" value="${escapeAttr(ad.title)}" onchange="state.ads.sidebarAds[${i}].title=this.value; saveState(); renderMain();" placeholder="Tag / Brand" class="px-2.5 py-2 rounded-lg bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-700 font-semibold" />
                      <input type="text" value="${escapeAttr(ad.url)}" onchange="state.ads.sidebarAds[${i}].url=this.value; saveState(); renderMain();" placeholder="Click Target URL" class="px-2.5 py-2 rounded-lg bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-700" />

                      <input type="text" value="${escapeAttr(ad.imageUrl && !ad.imageUrl.startsWith('data:') ? ad.imageUrl : '')}" onchange="state.ads.sidebarAds[${i}].imageUrl=this.value; saveState(); renderMain();" placeholder="Image / GIF / Video URL" class="sm:col-span-2 px-2.5 py-2 rounded-lg bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-700" />
                      <div class="flex items-center justify-between gap-2">

                        <label class="flex items-center gap-1.5 font-semibold"><input type="checkbox" ${ad.active?'checked':''} onchange="state.ads.sidebarAds[${i}].active=this.checked; saveState(); renderMain();" /> Active</label>
                        <button onclick="deleteSidebarAd(${i})" class="text-rose-500 font-bold">Del</button>
                      </div>
                    </div>
                    <textarea rows="2" onchange="state.ads.sidebarAds[${i}].htmlCode=this.value; saveState(); renderMain();" placeholder="Optional Custom HTML Ad Code (for animated/custom sidebar ad)" class="w-full px-2.5 py-2 rounded-lg bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-700 font-mono text-[11px]">${escapeHtml(ad.htmlCode || '')}</textarea>

            <div>
              <div class="flex items-center justify-between mb-2">
                <h3 class="text-sm font-bold">Sidebar Promo Link Cards (Below Sidebar Ad, Rounded Icon + Title + Link)</h3>

              </div>
              <div class="space-y-2.5">
                ${(state.ads.sidebarPromoCards || []).map((c, i) => `
                  <div class="p-3 rounded-xl bg-[#f7f9fc] dark:bg-zinc-800/60 border border-slate-200 dark:border-zinc-700 grid grid-cols-1 sm:grid-cols-4 gap-2 text-xs items-center">
                    <input type="text" value="${escapeAttr(c.title)}" onchange="state.ads.sidebarPromoCards[${i}].title=this.value; saveState(); renderMain();" placeholder="Title" class="px-2.5 py-2 rounded-lg bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-700 font-bold" />
                    <input type="text" value="${escapeAttr(c.desc)}" onchange="state.ads.sidebarPromoCards[${i}].desc=this.value; saveState(); renderMain();" placeholder="Short description" class="px-2.5 py-2 rounded-lg bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-700" />
                    <input type="text" value="${escapeAttr(c.url)}" onchange="state.ads.sidebarPromoCards[${i}].url=this.value; saveState(); renderMain();" placeholder="Target URL" class="px-2.5 py-2 rounded-lg bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-700" />
                    <div class="flex items-center justify-between gap-2">
                      <label class="inline-flex items-center gap-1 px-2.5 py-2 rounded-lg bg-blue-600 text-white cursor-pointer font-bold">${SVG.upload} Icon<input type="file" accept="image/*" class="hidden" onchange="uploadImageToPromoCard(${i}, this)" /></label>
                      <button onclick="deleteSidebarPromoCard(${i})" class="text-rose-500 font-bold">Del</button>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

            <div>
              <h3 class="text-sm font-bold mb-2">NOW TRACKING Marquee Strip Controls</h3>
              <div class="p-3.5 rounded-xl bg-[#f7f9fc] dark:bg-zinc-800/60 border border-slate-200 dark:border-zinc-700 space-y-3 text-xs">
                <div class="flex flex-wrap items-center gap-3">
                  <input type="text" value="${escapeAttr(state.settings.marqueeTitle || 'NOW TRACKING')}" onchange="state.settings.marqueeTitle=this.value; saveState(); renderMain();" placeholder="Strip Title" class="px-2.5 py-2 rounded-lg bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-700 font-bold" />
                  <label class="flex items-center gap-1.5 font-semibold"><input type="checkbox" ${state.settings.marqueeActive!==false?'checked':''} onchange="state.settings.marqueeActive=this.checked; saveState(); renderMain();" /> Show Marquee Strip on Home</label>
                </div>
                <div class="flex flex-wrap gap-1.5">
                  ${state.airdrops.map(a => `<button type="button" onclick="toggleMarquee('${a.id}'); openAdminModal();" class="px-2.5 py-1 rounded-lg font-bold border transition-colors ${a.marquee!==false ? 'bg-emerald-50 text-emerald-700 border-emerald-200 dark:bg-emerald-500/15 dark:text-emerald-300 dark:border-emerald-500/30' : 'bg-white dark:bg-zinc-900 text-slate-400 border-slate-200 dark:border-zinc-700'}">${escapeHtml(a.name)}</button>`).join('')}

      return `
        <div class="space-y-4 text-xs">
          <h3 class="text-sm font-bold">Site Branding, Logo & Security</h3>
