                        <div>

                    <!-- Global Search Bar -->

        ];

        let sidebarNavItems = [
            { id: 'airdrops', label: 'Airdrops', icon: 'fa-bolt', badge: '6' },

        ];

        let currentActiveTab = 'airdrops';
        let searchQuery = '';
        let selectedCategoryFilter = 'All';
        let selectedChainFilter = 'All';
        let selectedStatusFilter = 'All';

        // Initialize App on load
        window.onload = function() {
            renderSidebar();
            renderMainContent();
        };

        // Toast Notification Helper
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `flex items-center gap-3 px-4 py-3 rounded-2xl shadow-xl text-sm font-medium text-white transition-all transform translate-y-2 opacity-0 ${type === 'success' ? 'bg-emerald-600' : 'bg-slate-800'}`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check text-emerald-300' : 'fa-circle-info'}"></i> <span>${message}</span>`;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Theme Toggle
        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (html.classList.contains('light')) {
                html.classList.remove('light');
                html.classList.add('dark');
                icon.className = 'fa-solid fa-sun text-sm';
                showToast('Switched to Dark Mode', 'info');
            } else {
                html.classList.remove('dark');
                html.classList.add('light');
                icon.className = 'fa-solid fa-moon text-sm';
                showToast('Switched to Light Mode', 'success');
            }
        }

        // Sidebar Toggle for Mobile
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('-translate-x-full');
        }

        // Wallet Connection Simulation
        let isConnected = false;
        function connectWallet() {
            const btnText = document.getElementById('wallet-text');
            if (!isConnected) {
                isConnected = true;
                btnText.innerText = '0x71C...3a9f';
                showToast('Wallet connected successfully via MetaMask!');
            } else {
                isConnected = false;
                btnText.innerText = 'Connect Wallet';
                showToast('Wallet disconnected', 'info');
            }
        }

        // Switch Navigation Tab
        function switchTab(tabId) {
            currentActiveTab = tabId;
            renderSidebar();
            renderMainContent();
            // Close mobile sidebar if open
            if(window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('-translate-x-full');
            }
        }

        // Render Sidebar Navigation
        function renderSidebar() {
            const nav = document.getElementById('sidebar-nav');
            let html = '';
            
            sidebarNavItems.forEach(item => {
                const isActive = currentActiveTab === item.id;
                html += `
                    <button onclick="switchTab('${item.id}')" class="w-full flex items-center justify-between px-4 py-3 rounded-2xl text-sm font-medium transition-all ${isActive ? 'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 font-semibold' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/60 hover:text-slate-900 dark:hover:text-slate-200'}">
                        <div class="flex items-center gap-3">
                            <i class="fa-solid ${item.icon} w-5 text-center"></i>
                            <span>${item.label}</span>
                        </div>
                    </button>
                `;
            });

            nav.innerHTML = html;
        }

        // Handle Search Input
        function handleSearch(query) {
            searchQuery = query.toLowerCase();
            renderMainContent();
        }

        // Filter Handlers
        function setCategoryFilter(cat) {
            selectedCategoryFilter = cat;
            renderMainContent();
        }
        function setChainFilter(chain) {
            selectedChainFilter = chain;
            renderMainContent();
        }
        function setStatusFilter(status) {
            selectedStatusFilter = status;
            renderMainContent();
        }

        // Render Main Content Based on Active Tab
        function renderMainContent() {
            const container = document.getElementById('main-content');

            if (currentActiveTab === 'admin') {
                renderAdminView(container);
                return;
            }

            // Check if currentActiveTab is a detail view (e.g. 'airdrop-detail-1')
            if (currentActiveTab.startsWith('airdrop-detail-')) {
                const dropId = parseInt(currentActiveTab.replace('airdrop-detail-', ''));
                renderAirdropDetailPage(container, dropId);
                return;
            }

            if (currentActiveTab !== 'airdrops') {
                renderPlaceholderView(container, currentActiveTab);
                return;
            }

            // Filter Airdrops
            let filtered = airdropsData.filter(drop => {
                const matchesSearch = drop.name.toLowerCase().includes(searchQuery) || drop.shortDesc.toLowerCase().includes(searchQuery) || drop.category.toLowerCase().includes(searchQuery);
                const matchesCat = selectedCategoryFilter === 'All' || drop.category === selectedCategoryFilter;
                const matchesChain = selectedChainFilter === 'All' || drop.network === selectedChainFilter;
                const matchesStatus = selectedStatusFilter === 'All' || drop.status === selectedStatusFilter;
                return matchesSearch && matchesCat && matchesChain && matchesStatus;
            });

            let html = `
                <!-- Filters & Search Toolbar -->
                <div class="flex flex-wrap items-center justify-between gap-4 mb-8 bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">

                                <option value="All">All Categories (${['All', ...new Set(airdropsData.map(d => d.category))].length - 1})</option>
                                ${[...new Set(airdropsData.map(d => d.category))].map(cat => `<option value="${cat}" ${selectedCategoryFilter === cat ? 'selected' : ''}>${cat}</option>`).join('')}
                            </select>
                            <i class="fa-solid fa-chevron-down absolute right-3.5 top-1/2 -translate-y-1/2 text-xs text-slate-400 pointer-events-none"></i>
                        </div>

                        <!-- Chain Filter Dropdown -->
                        <div class="relative">
                            <select onchange="setChainFilter(this.value)" class="appearance-none bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-4 py-2.5 pr-10 rounded-xl text-xs font-semibold border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 cursor-pointer">
                                <option value="All">All Chains</option>
                                ${[...new Set(airdropsData.map(d => d.network))].map(net => `<option value="${net}" ${selectedChainFilter === net ? 'selected' : ''}>${net}</option>`).join('')}
                            </select>
                            <i class="fa-solid fa-chevron-down absolute right-3.5 top-1/2 -translate-y-1/2 text-xs text-slate-400 pointer-events-none"></i>
                        </div>

                        <!-- Status Filter Dropdown -->
                        <div class="relative">
                            <select onchange="setStatusFilter(this.value)" class="appearance-none bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-4 py-2.5 pr-10 rounded-xl text-xs font-semibold border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 cursor-pointer">
                                <option value="All">All Status</option>
                                <option value="Active" ${selectedStatusFilter === 'Active' ? 'selected' : ''}>Active</option>
                                <option value="Upcoming" ${selectedStatusFilter === 'Upcoming' ? 'selected' : ''}>Upcoming</option>
                            </select>
                            <i class="fa-solid fa-chevron-down absolute right-3.5 top-1/2 -translate-y-1/2 text-xs text-slate-400 pointer-events-none"></i>

                    </div>

                        </div>
                        <h3 class="text-lg font-bold text-slate-800 dark:text-slate-200 mb-1">No airdrops found</h3>
                        <p class="text-sm text-slate-500 dark:text-slate-400">Try adjusting your search or filter criteria.</p>
                    </div>
                `;
            } else {
                filtered.forEach(drop => {
                    html += `
                        <div onclick="switchTab('airdrop-detail-${drop.id}')" class="group bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 hover:border-emerald-500/50 dark:hover:border-emerald-500/50 p-6 shadow-sm hover:shadow-xl transition-all duration-300 cursor-pointer flex flex-col justify-between relative overflow-hidden">
                            <div class="absolute top-0 right-0 w-32 h-32 bg-gradient-to-br from-emerald-500/5 to-transparent rounded-bl-full pointer-events-none"></div>
                            
                            <div>
                                <div class="flex items-center justify-between mb-6">
                                    <span class="text-xs font-bold text-slate-400">${drop.number}</span>
                                    <div class="flex items-center gap-2">
                                        <span class="px-2.5 py-1 rounded-full text-[10px] font-bold ${drop.badgeColor}">${drop.badge}</span>
                                        <span class="px-2.5 py-1 rounded-full text-[10px] font-bold ${drop.statusClass}">${drop.status}</span>

                                </div>

                                <div class="flex items-center gap-4 mb-4">

                                        ${drop.iconText}

                                    <div>
                                        <h3 class="text-lg font-bold text-slate-900 dark:text-white group-hover:text-emerald-600 dark:group-hover:text-emerald-400 transition-colors">${drop.name}</h3>
                                        <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">${drop.category} • ${drop.subCategory}</p>

                            <div>
                                <div class="flex items-center justify-between pt-4 border-t border-slate-100 dark:border-slate-800/80 text-xs mb-4">
                                    <span class="text-slate-400">Network: <strong class="text-slate-700 dark:text-slate-300">${drop.network}</strong></span>
                                    <span class="text-slate-400">Funding: <strong class="text-emerald-600 dark:text-emerald-400">${drop.funding}</strong></span>
                                </div>

                                <button class="w-full py-2.5 px-4 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200 group-hover:bg-emerald-600 group-hover:text-white font-semibold text-xs transition-all flex items-center justify-center gap-2">
                                    <span>View Tasks & Guide</span>
                                    <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });
            }

            html += `</div>`;
            container.innerHTML = html;
        }

        // Render Dedicated Airdrop Post Detail Page
        function renderAirdropDetailPage(container, dropId) {
            const drop = airdropsData.find(d => d.id === dropId);

                        <p class="text-base font-bold text-emerald-600 dark:text-emerald-400">${drop.funding}</p>

                <div class="flex items-center gap-3">

            });

            container.innerHTML = `
                <div class="max-w-6xl mx-auto">

                                <input type="text" id="admin-category" required placeholder="e.g. Layer 1" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500">

                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Funding Amount</label>

                            <div class="sm:col-span-2">

                                    <option value="HOT">HOT</option>

        // Add New Airdrop Action
        function handleAddNewAirdrop(e) {
            e.preventDefault();
            const name = document.getElementById('admin-name').value;
            const category = document.getElementById('admin-category').value;
            const network = document.getElementById('admin-network').value;
            const funding = document.getElementById('admin-funding').value;
            const shortDesc = document.getElementById('admin-desc').value;
            const badge = document.getElementById('admin-badge').value;
            const status = document.getElementById('admin-status').value;

            const newDrop = {
                id: airdropsData.length + 1,
                number: String(airdropsData.length + 1).padStart(2, '0'),
                name: name,
                category: category,
                subCategory: network,
                network: network,
                status: status,
                statusClass: status === 'Active' ? 'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400' : 'bg-amber-500/10 text-amber-600 dark:text-amber-400',
                badge: badge,
                badgeColor: 'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400',
                iconText: name.charAt(0).toUpperCase(),
                bgColor: 'bg-emerald-100 dark:bg-emerald-950/40 border-emerald-200 dark:border-emerald-900/50',
                shortDesc: shortDesc,
                funding: funding,
                tasks: [
                    'Connect Web3 wallet to official protocol dashboard.',
                    'Complete testnet transactions or liquidity swaps.',
                    'Claim badge and verify completion.'
                ],
                link: '#'
            };

            airdropsData.unshift(newDrop);
            sidebarNavItems[0].badge = String(airdropsData.length);
            showToast(`Airdrop "${name}" added successfully!`);
            renderAdminView(document.getElementById('main-content'));
        }

        // Delete Airdrop Action
        function deleteAirdrop(id) {
            airdropsData = airdropsData.filter(d => d.id !== id);
            sidebarNavItems[0].badge = String(airdropsData.length);
            showToast('Airdrop deleted successfully', 'info');
            renderAdminView(document.getElementById('main-content'));
        }
    </script>
