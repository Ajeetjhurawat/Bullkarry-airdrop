<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Airdrops & Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-zinc-950 dark:text-gray-100 min-h-screen flex flex-col transition-colors duration-200">

    <!-- Top Navigation Bar -->
    <header class="h-16 border-b border-gray-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 px-6 flex items-center justify-between sticky top-0 z-40">
        <div class="flex items-center space-x-3">
            <div class="bg-black dark:bg-white text-white dark:text-black w-9 h-9 rounded-xl flex items-center justify-center font-bold text-lg shadow-sm">
                <i class="fa-solid fa-bolt"></i>
            </div>
            <span class="font-bold text-xl tracking-tight">Alpha Drops</span>
        </div>
        
        <div class="flex items-center space-x-4">
            <!-- Theme Toggle -->
            <button onclick="toggleDarkMode()" class="w-10 h-10 rounded-lg border border-gray-200 dark:border-zinc-800 flex items-center justify-center hover:bg-gray-100 dark:hover:bg-zinc-800 transition">
                <i id="themeIcon" class="fa-solid fa-moon text-gray-600 dark:text-yellow-400"></i>
            </button>
            <!-- Admin Toggle Button -->
            <button onclick="toggleAdminModal()" class="bg-brand-500 hover:bg-brand-600 text-white font-medium px-4 py-2 rounded-xl text-sm transition flex items-center space-x-2 shadow-sm">
                <i class="fa-solid fa-gear"></i>
                <span>Admin Panel</span>
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar Navigation -->
        <aside class="w-64 border-r border-gray-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 hidden md:flex flex-col p-4 space-y-2">
            <a href="#" onclick="switchTab('airdrops')" id="nav-airdrops" class="flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm transition bg-brand-50 text-brand-700 dark:bg-zinc-800 dark:text-white">
                <i class="fa-solid fa-parachute-box w-5"></i>
                <span>Airdrops</span>
            </a>
            <a href="#" onclick="switchTab('perps')" id="nav-perps" class="flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-zinc-800 transition">
                <i class="fa-solid fa-chart-line w-5"></i>
                <span>Perps</span>
            </a>
            <a href="#" onclick="switchTab('tracker')" id="nav-tracker" class="flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-zinc-800 transition">
                <i class="fa-solid fa-shield-halved w-5"></i>
                <span>Tracker</span>
            </a>
            <a href="#" onclick="switchTab('claims')" id="nav-claims" class="flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-zinc-800 transition">
                <i class="fa-solid fa-gift w-5"></i>
                <span>Claims</span>
            </a>
            <a href="#" onclick="switchTab('checkers')" id="nav-checkers" class="flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-zinc-800 transition">
                <i class="fa-solid fa-magnifying-glass w-5"></i>
                <span>Checkers</span>
            </a>
            <a href="#" onclick="switchTab('raises')" id="nav-raises" class="flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-zinc-800 transition">
                <i class="fa-solid fa-coins w-5"></i>
                <span>Raises</span>
            </a>
        </aside>

        <!-- Main Content Viewport -->
        <main class="flex-1 overflow-y-auto p-6 md:p-10" id="main-viewport">
            
            <!-- LIST VIEW -->
            <div id="view-list">
                <!-- Title & Subtitle -->
                <div class="mb-8">
                    <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight mb-2">Crypto Airdrops</h1>
                    <p class="text-gray-500 dark:text-gray-400 text-base">Find credible projects and track what matters.</p>
                </div>

                <!-- Custom Ad Banner Section -->
                <div id="ad-banner-container" class="mb-8">
                    <!-- Dynamic Ad Inserted Here -->
                </div>

                <!-- Filter & Search Bar -->
                <div class="bg-white dark:bg-zinc-900 border border-gray-200 dark:border-zinc-800 p-4 rounded-2xl mb-8 flex flex-wrap gap-4 items-center justify-between shadow-sm">
                    <div class="flex items-center space-x-3 flex-1 min-w-[240px] bg-gray-50 dark:bg-zinc-800 px-4 py-2 rounded-xl border border-gray-200 dark:border-zinc-700">
                        <i class="fa-solid fa-search text-gray-400"></i>
                        <input type="text" id="searchInput" oninput="filterAirdrops()" placeholder="Search airdrops..." class="bg-transparent border-none outline-none w-full text-sm">
                    </div>
                    <div class="flex flex-wrap gap-3">
                        <select id="filterCategory" onchange="filterAirdrops()" class="bg-gray-50 dark:bg-zinc-800 border border-gray-200 dark:border-zinc-700 px-4 py-2 rounded-xl text-sm font-medium outline-none">
                            <option value="All">All Categories</option>
                            <option value="DeFi">DeFi</option>
                            <option value="DEX">DEX</option>
                            <option value="AI">AI</option>
                            <option value="L1">L1 / Blockchain</option>
                        </select>
                        <select id="filterStatus" onchange="filterAirdrops()" class="bg-gray-50 dark:bg-zinc-800 border border-gray-200 dark:border-zinc-700 px-4 py-2 rounded-xl text-sm font-medium outline-none">
                            <option value="All">All Status</option>
                            <option value="Active">Active</option>
                            <option value="Upcoming">Upcoming</option>
                            <option value="Claimable">Claimable</option>
                        </select>
                    </div>
                </div>

                <!-- Airdrops Grid -->
                <div id="airdropsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                    <!-- Cards populated by JS -->
                </div>
            </div>

            <!-- DETAIL VIEW -->
            <div id="view-detail" class="hidden max-w-4xl mx-auto">
                <button onclick="backToList()" class="mb-6 flex items-center space-x-2 text-sm font-medium text-gray-500 hover:text-gray-900 dark:hover:text-white transition">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Back to Airdrops</span>
                </button>
                <div id="detailContent" class="bg-white dark:bg-zinc-900 border border-gray-200 dark:border-zinc-800 rounded-3xl p-6 md:p-10 shadow-sm">
                    <!-- Populated dynamically -->
                </div>
            </div>

        </main>
    </div>

    <!-- Admin Modal -->
    <div id="adminModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-zinc-900 border border-gray-200 dark:border-zinc-800 w-full max-w-2xl rounded-3xl p-6 md:p-8 max-h-[90vh] overflow-y-auto shadow-2xl">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-bold">Platform Admin Panel</h3>
                <button onclick="toggleAdminModal()" class="w-8 h-8 rounded-full bg-gray-100 dark:bg-zinc-800 flex items-center justify-center hover:bg-gray-200 transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="space-y-8">
                <!-- Manage Ad Banner -->
                <div class="p-5 rounded-2xl bg-gray-50 dark:bg-zinc-800/50 border border-gray-200 dark:border-zinc-800">
                    <h4 class="font-semibold mb-4 flex items-center space-x-2 text-brand-600">
                        <i class="fa-solid fa-rectangle-ad"></i>
                        <span>Configure Promotional Ad Banner</span>
                    </h4>
                    <div class="space-y-4 text-sm">
                        <div>
                            <label class="block font-medium mb-1">Ad Title</label>
                            <input type="text" id="adminAdTitle" class="w-full bg-white dark:bg-zinc-800 border border-gray-200 dark:border-zinc-700 px-4 py-2 rounded-xl">
                        </div>
                        <div>
                            <label class="block font-medium mb-1">Ad Description</label>
                            <input type="text" id="adminAdDesc" class="w-full bg-white dark:bg-zinc-800 border border-gray-200 dark:border-zinc-700 px-4 py-2 rounded-xl">
                        </div>
                        <div>
                            <label class="block font-medium mb-1">Target Link URL</label>
                            <input type="text" id="adminAdLink" class="w-full bg-white dark:bg-zinc-800 border border-gray-200 dark:border-zinc-700 px-4 py-2 rounded-xl">
                        </div>
                        <button onclick="saveAdBanner()" class="bg-brand-500 hover:bg-brand-600 text-white font-medium px-4 py-2 rounded-xl transition">Update Ad Banner</button>
                    </div>
                </div>

                <!-- Add / Manage Airdrops -->
                <div>
                    <h4 class="font-semibold mb-4 flex items-center space-x-2 text-brand-600">
                        <i class="fa-solid fa-plus-circle"></i>
                        <span>Add New Airdrop Project</span>
                    </h4>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm mb-4">
                        <input type="text" id="newTitle" placeholder="Project Name (e.g. EtherFi)" class="bg-gray-50 dark:bg-zinc-800 border border-gray-200 dark:border-zinc-700 px-4 py-2 rounded-xl">
                        <input type="text" id="newCategory" placeholder="Category (e.g. DeFi, DEX)" class="bg-gray-50 dark:bg-zinc-800 border border-gray-200 dark:border-zinc-700 px-4 py-2 rounded-xl">
                        <input type="text" id="newChains" placeholder="Chains / Backing (e.g. Ethereum, Base)" class="bg-gray-50 dark:bg-zinc-800 border border-gray-200 dark:border-zinc-700 px-4 py-2 rounded-xl">
                        <select id="newStatus" class="bg-gray-50 dark:bg-zinc-800 border border-gray-200 dark:border-zinc-700 px-4 py-2 rounded-xl">
                            <option value="Active">Active</option>
                            <option value="Upcoming">Upcoming</option>
                            <option value="Claimable">Claimable</option>
                        </select>
                    </div>
                    <textarea id="newDesc" placeholder="Project Description & Task Guide..." class="w-full bg-gray-50 dark:bg-zinc-800 border border-gray-200 dark:border-zinc-700 px-4 py-2 rounded-xl text-sm mb-4 h-24"></textarea>
                    <button onclick="addNewAirdrop()" class="w-full bg-black dark:bg-white text-white dark:text-black font-semibold py-3 rounded-xl transition">Publish Airdrop</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // Initial Data mimicking Alpha Drops database
        let airdropsData = [
            { id: 1, title: "1K", category: "DeFi", chains: "Robinhood, Ethereum, Base", status: "Active", desc: "Best execution for tokenized stocks and crypto, on every chain, around the clock.", bg: "bg-indigo-100 dark:bg-indigo-950/40 text-indigo-700 dark:text-indigo-300", logoText: "1k" },
            { id: 2, title: "Metric", category: "DEX", chains: "Ethereum, BNB Chain, Robinhood", status: "Active", desc: "Oracle-priced DEX for tokenized stocks and crypto, built by an ex-Uniswap engineering lead.", bg: "bg-cyan-100 dark:bg-cyan-950/40 text-cyan-700 dark:text-cyan-300", logoText: "Me" },
            { id: 3, title: "Catalyst", category: "AI", chains: "Multichain", status: "Upcoming", desc: "AI agents that turn your trading ideas into automated strategies, backed by Sequoia.", bg: "bg-gray-200 dark:bg-zinc-800 text-gray-700 dark:text-gray-300", logoText: "Ca" },
            { id: 4, title: "TxFlow", category: "L1", chains: "Arbitrum", status: "Active", desc: "TxFlow is an L1 blockchain with DAG architecture, 250K TPS, and shared liquidity across apps without bridges.", bg: "bg-emerald-100 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300", logoText: "Tx" },
            { id: 5, title: "PopDEX", category: "DEX", chains: "Morph Tachyon", status: "Active", desc: "PopDEX - Funding and decentralized liquidity protocol for high-performance trading.", bg: "bg-blue-100 dark:bg-blue-950/40 text-blue-700 dark:text-blue-300", logoText: "Po" },
            { id: 6, title: "Arcus", category: "DeFi", chains: "Robinhood", status: "Active", desc: "24/7 stock token trading with zero fees today, join the waitlist to trade Perpetuals with leverage.", bg: "bg-purple-100 dark:bg-purple-950/40 text-purple-700 dark:text-purple-300", logoText: "Ar" },
            { id: 7, title: "Bulk", category: "DEX", chains: "Solana", status: "Active", desc: "BULK is a decentralized trading system designed to reduce the latency gap between centralized and decentralized markets.", bg: "bg-amber-100 dark:bg-amber-950/40 text-amber-700 dark:text-amber-300", logoText: "Bu" },
            { id: 8, title: "BaiBai", category: "DEX", chains: "Base", status: "Active", desc: "BaiBai is a Prop AMM, a new type of decentralized exchange that quotes prices in real-time.", bg: "bg-teal-100 dark:bg-teal-950/40 text-teal-700 dark:text-teal-300", logoText: "Bb" }
        ];

        let adConfig = {
            title: "Taba - All-in-One Trading Terminal",
            desc: "Perps across 12 venues with zero gas friction.",
            link: "https://alphadrops.net/"
        };

        function renderAdBanner() {
            const container = document.getElementById('ad-banner-container');
            container.innerHTML = `
                <div class="bg-gradient-to-r from-emerald-900 to-zinc-900 text-white p-6 rounded-3xl flex flex-col md:flex-row items-center justify-between shadow-lg">
                    <div class="mb-4 md:mb-0">
                        <span class="bg-brand-500/20 text-brand-400 text-xs px-3 py-1 rounded-full font-semibold uppercase tracking-wider">Featured Sponsor</span>
                        <h3 class="text-xl font-bold mt-2">${adConfig.title}</h3>
                        <p class="text-gray-300 text-sm mt-1">${adConfig.desc}</p>
                    </div>
                    <a href="${adConfig.link}" target="_blank" class="bg-white text-black font-semibold px-6 py-2.5 rounded-xl text-sm hover:bg-gray-100 transition shadow-sm">
                        Learn More <i class="fa-solid fa-arrow-up-right-from-square ml-1 text-xs"></i>
                    </a>
                </div>
            `;
        }

        function renderAirdrops(items) {
            const grid = document.getElementById('airdropsGrid');
            grid.innerHTML = '';
            items.forEach(item => {
                const statusColor = item.status === 'Active' ? 'text-emerald-500' : (item.status === 'Upcoming' ? 'text-amber-500' : 'text-blue-500');
                grid.innerHTML += `
                    <div onclick="openDetail(${item.id})" class="bg-white dark:bg-zinc-900 border border-gray-200 dark:border-zinc-800 rounded-3xl p-6 hover:shadow-xl transition cursor-pointer flex flex-col justify-between group">
                        <div>
                            <div class="flex items-center justify-between mb-4">
                                <div class="w-12 h-12 rounded-2xl ${item.bg} flex items-center justify-center font-bold text-lg shadow-inner">
                                    ${item.logoText}
                                </div>
                                <span class="text-xs font-semibold px-3 py-1 rounded-full bg-gray-100 dark:bg-zinc-800 ${statusColor}">
                                    ● ${item.status}
                                </span>
                            </div>
                            <h3 class="font-bold text-lg group-hover:text-brand-500 transition mb-1">${item.title}</h3>
                            <p class="text-sm text-gray-500 dark:text-gray-400 line-clamp-2 mb-4">${item.desc}</p>
                        </div>
                        <div class="pt-4 border-t border-gray-100 dark:border-zinc-800 flex items-center justify-between text-xs text-gray-400">
                            <span>${item.chains}</span>
                            <span class="font-medium text-brand-500 flex items-center space-x-1">
                                <span>View tasks</span>
                                <i class="fa-solid fa-arrow-right text-[10px]"></i>
                            </span>
                        </div>
                    </div>
                `;
            });
        }

        function filterAirdrops() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('filterCategory').value;
            const status = document.getElementById('filterStatus').value;

            const filtered = airdropsData.filter(item => {
                const matchesQuery = item.title.toLowerCase().includes(query) || item.desc.toLowerCase().includes(query);
                const matchesCategory = category === 'All' || item.category === category;
                const matchesStatus = status === 'All' || item.status === status;
                return matchesQuery && matchesCategory && matchesStatus;
            });
            renderAirdrops(filtered);
        }

        function openDetail(id) {
            const item = airdropsData.find(x => x.id === id);
            if (!item) return;

            document.getElementById('view-list').classList.add('hidden');
            document.getElementById('view-detail').classList.remove('hidden');

            const container = document.getElementById('detailContent');
            container.innerHTML = `
                <div class="flex items-center space-x-4 mb-6">
                    <div class="w-16 h-16 rounded-2xl ${item.bg} flex items-center justify-center font-bold text-2xl shadow-inner">
                        ${item.logoText}
                    </div>
                    <div>
                        <div class="flex items-center space-x-3">
                            <h1 class="text-2xl md:text-3xl font-extrabold">${item.title}</h1>
                            <span class="text-xs font-semibold px-3 py-1 rounded-full bg-brand-50 text-brand-600 dark:bg-zinc-800 dark:text-brand-400">${item.status}</span>
                        </div>
                        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Chains & Backing: ${item.chains}</p>
                    </div>
                </div>
                <div class="space-y-6 text-sm text-gray-600 dark:text-gray-300">
                    <div>
                        <h3 class="font-bold text-base text-gray-900 dark:text-white mb-2">About Project</h3>
                        <p class="leading-relaxed">${item.desc}</p>
                    </div>
                    <div class="bg-gray-50 dark:bg-zinc-800/50 p-6 rounded-2xl border border-gray-200 dark:border-zinc-800">
                        <h3 class="font-bold text-base text-gray-900 dark:text-white mb-3">Airdrop Tasks & Guide</h3>
                        <ul class="space-y-2 list-disc list-inside">
                            <li>Connect Web3 wallet and switch to supported network (${item.chains}).</li>
                            <li>Interact with the core protocol contracts and execute testnet/mainnet volume.</li>
                            <li>Verify your eligibility and claim rewards upon token generation event (TGE).</li>
                        </ul>
                    </div>
                    <div class="flex items-center space-x-4 pt-4">
                        <a href="https://alphadrops.net/" target="_blank" class="bg-brand-500 hover:bg-brand-600 text-white font-semibold px-6 py-3 rounded-xl transition shadow-sm">
                            Open Official App <i class="fa-solid fa-external-link ml-1 text-xs"></i>
                        </a>
                    </div>
                </div>
            `;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function backToList() {
            document.getElementById('view-detail').classList.add('hidden');
            document.getElementById('view-list').classList.remove('hidden');
        }

        function toggleAdminModal() {
            const modal = document.getElementById('adminModal');
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden')) {
                document.getElementById('adminAdTitle').value = adConfig.title;
                document.getElementById('adminAdDesc').value = adConfig.desc;
                document.getElementById('adminAdLink').value = adConfig.link;
            }
        }

        function saveAdBanner() {
            adConfig.title = document.getElementById('adminAdTitle').value;
            adConfig.desc = document.getElementById('adminAdDesc').value;
            adConfig.link = document.getElementById('adminAdLink').value;
            renderAdBanner();
            toggleAdminModal();
        }

        function addNewAirdrop() {
            const title = document.getElementById('newTitle').value;
            const category = document.getElementById('newCategory').value;
            const chains = document.getElementById('newChains').value;
            const status = document.getElementById('newStatus').value;
            const desc = document.getElementById('newDesc').value;

            if (!title) {
                alert('Please enter a project title');
                return;
            }

            const newItem = {
                id: airdropsData.length + 1,
                title,
                category: category || 'DeFi',
                chains: chains || 'Multi-Chain',
                status,
                desc: desc || 'Participate in community airdrop tasks.',
                bg: 'bg-emerald-100 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300',
                logoText: title.substring(0, 2).toUpperCase()
            };

            airdropsData.unshift(newItem);
            renderAirdrops(airdropsData);
            toggleAdminModal();
            alert('Airdrop published successfully!');
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            const icon = document.getElementById('themeIcon');
            if (document.documentElement.classList.contains('dark')) {
                icon.className = "fa-solid fa-sun text-yellow-400";
            } else {
                icon.className = "fa-solid fa-moon text-gray-600";
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('aside a').forEach(el => {
                el.className = "flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-zinc-800 transition";
            });
            const activeEl = document.getElementById('nav-' + tab);
            if (activeEl) {
                activeEl.className = "flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm transition bg-brand-50 text-brand-700 dark:bg-zinc-800 dark:text-white";
            }
        }

        // Initialize App on load
        renderAdBanner();
        renderAirdrops(airdropsData);
    </script>
</body>
</html>
