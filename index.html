      try { localStorage.setItem('bullkarry_theme', mode); } catch (e) {}

      selectedAirdropId = airdropId;
      toggleMobileSidebar(false);
      renderAll();
      window.scrollTo(0, 0);
      document.documentElement.scrollTop = 0;
      document.body.scrollTop = 0;
    }

    function handleJoinNow(e) {
      e.preventDefault();
      window.open(state.settings.joinNowUrl || 'https://t.me', '_blank', 'noopener');
    }

    // =========================================================================
    // RENDER CHROME
    // =========================================================================
    function renderChrome() {
      const brandBox = document.getElementById('brandLogoBox');
      if (state.settings.brandLogoUrl) {
        brandBox.innerHTML = `<img src="${escapeAttr(state.settings.brandLogoUrl)}" alt="Brand" class="w-full h-full object-cover" />`;
      } else {
        brandBox.textContent = state.settings.brandInitials || 'BK';
      }

      document.getElementById('brandNameDisplay').textContent = state.settings.brandName || 'Bullkarry';
      document.getElementById('footerBrandName').textContent = state.settings.brandName || 'Bullkarry';
      document.getElementById('footerLogoMini').textContent = state.settings.brandInitials || 'BK';

      const joinBtn = document.getElementById('joinNowBtn');
      joinBtn.textContent = state.settings.joinNowLabel || 'Join Now';
      joinBtn.href = state.settings.joinNowUrl || 'https://t.me/bullkarry';

      const activeCount = state.airdrops.filter(a => a.status === 'Active').length;
      document.getElementById('sidebarProjectCount').textContent = `${activeCount} Active Campaigns`;
      document.getElementById('headerSavedCount').textContent = `${state.tracker.savedIds.length} Tracked`;

      const navEl = document.getElementById('sidebarNav');
      navEl.innerHTML = state.menus.filter(m => m.visible).map(m => {
        const isActive = currentRoute === m.id || (currentRoute === 'detail' && m.id === 'airdrops') || (currentRoute === 'home' && m.id === 'airdrops');
        const cls = isActive
          ? 'bg-[#eef4ff] text-[#2563eb] border border-[#dbeafe] dark:bg-blue-500/15 dark:text-blue-400 dark:border-blue-500/25 font-bold shadow-xs'
          : 'text-slate-600 dark:text-zinc-300 hover:bg-slate-50 dark:hover:bg-zinc-800/80 hover:text-slate-900 dark:hover:text-white border border-transparent font-semibold';
        return `
          <button onclick="navigateTo('${m.id}')" class="w-full flex items-center gap-3.5 px-4 py-3 rounded-2xl text-[15px] transition-all ${cls}">
            ${getMenuIcon(m.icon)}
            <span class="truncate">${escapeHtml(m.label)}</span>
          </button>
        `;
      }).join('');

      const hLogo = document.getElementById('headerBrandLogo');
      const hName = document.getElementById('headerBrandName');
      if (hLogo) {
        if (state.settings.brandLogoUrl) hLogo.innerHTML = `<img src="${escapeAttr(state.settings.brandLogoUrl)}" alt="Brand" class="w-full h-full object-cover" />`;
        else hLogo.textContent = state.settings.brandInitials || 'BK';
      }
      if (hName) hName.textContent = state.settings.brandName || 'Bullkarry';

      // Mobile Bottom Nav (Bullkarry style: 2 left, Center Raised Home Button, 2 right)
      const mobileIds = ['airdrops', 'perps', 'home', 'claims', 'checkers'];
      const mbNav = document.getElementById('mobileBottomNav');
      if (mbNav) {
        mbNav.innerHTML = mobileIds.map((id, idx) => {
          if (idx === 2) {
            return `
              <button onclick="navigateTo('home')" class="relative -mt-6 flex flex-col items-center justify-center group" aria-label="Home">
                <span class="w-[52px] h-[52px] rounded-full bg-blue-600 hover:bg-blue-700 text-white shadow-lg shadow-blue-600/35 ring-4 ring-[#f7f9fc] dark:ring-zinc-950 flex items-center justify-center transition-transform group-active:scale-95">
                  ${getMenuIcon('home')}
                </span>
              </button>
            `;
          }
          const m = state.menus.find(x => x.id === id) || { id, label: id.charAt(0).toUpperCase() + id.slice(1), icon: 'star' };
          const active = currentRoute === id || (currentRoute === 'detail' && id === 'airdrops');
          return `
            <button onclick="navigateTo('${m.id}')" class="flex flex-col items-center justify-center gap-1 px-2.5 py-1 rounded-xl transition-colors ${active ? 'text-blue-600 dark:text-blue-400 font-bold' : 'text-slate-500 dark:text-zinc-400 font-semibold'}">
              ${getMenuIcon(m.icon)}
              <span class="text-[10px] leading-tight">${escapeHtml(m.label)}</span>
            </button>
          `;
        }).join('');
      }

      const s = state.settings.socials || {};
      document.getElementById('footerSocials').innerHTML = `
        <a href="${escapeAttr(s.x || '#')}" target="_blank" rel="noopener" class="w-8 h-8 rounded-lg border border-slate-200/80 dark:border-zinc-700 flex items-center justify-center text-slate-500 hover:text-slate-900 dark:hover:text-white hover:bg-slate-50 dark:hover:bg-zinc-800 transition-colors" title="X / Twitter">${SVG.socialX}</a>
        <a href="${escapeAttr(s.telegram || '#')}" target="_blank" rel="noopener" class="w-8 h-8 rounded-lg border border-slate-200/80 dark:border-zinc-700 flex items-center justify-center text-slate-500 hover:text-slate-900 dark:hover:text-white hover:bg-slate-50 dark:hover:bg-zinc-800 transition-colors" title="Telegram">${SVG.socialTg}</a>
        <a href="${escapeAttr(s.discord || '#')}" target="_blank" rel="noopener" class="w-8 h-8 rounded-lg border border-slate-200/80 dark:border-zinc-700 flex items-center justify-center text-slate-500 hover:text-slate-900 dark:hover:text-white hover:bg-slate-50 dark:hover:bg-zinc-800 transition-colors" title="Discord">${SVG.socialDc}</a>
      `;
    }

    // =========================================================================
    // HELPERS
    // =========================================================================
    function getTintClasses(tint) {
      const map = {
        lavender: 'bg-indigo-50/75 dark:bg-indigo-950/35 border-indigo-200/60 dark:border-indigo-800/50',
        sky: 'bg-sky-50/75 dark:bg-sky-950/35 border-sky-200/60 dark:border-sky-800/50',
        sand: 'bg-amber-50/70 dark:bg-zinc-800/70 border-amber-200/60 dark:border-zinc-700',
        mint: 'bg-emerald-50/75 dark:bg-emerald-950/35 border-emerald-200/60 dark:border-emerald-800/50',
        periwinkle: 'bg-violet-50/75 dark:bg-violet-950/35 border-violet-200/60 dark:border-violet-800/50'
      };
      return map[tint] || map.lavender;
    }

    function getStatusBadge(status) {
      const map = {
        Active: 'bg-emerald-50 text-emerald-700 border-emerald-200/70 dark:bg-emerald-500/15 dark:text-emerald-400 dark:border-emerald-500/30',
        Upcoming: 'bg-amber-50 text-amber-700 border-amber-200/70 dark:bg-amber-500/15 dark:text-amber-400 dark:border-amber-500/30',
        Claimable: 'bg-blue-50 text-blue-700 border-blue-200/70 dark:bg-blue-500/15 dark:text-blue-400 dark:border-blue-500/30',
        Ended: 'bg-slate-100 text-slate-600 border-slate-200 dark:bg-zinc-800 dark:text-zinc-400 dark:border-zinc-700'
      };
      const dot = status === 'Active' ? 'bg-emerald-500' : status === 'Upcoming' ? 'bg-amber-500' : status === 'Claimable' ? 'bg-blue-500' : 'bg-slate-400';
      return `<span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold border ${map[status] || map.Active}"><span class="w-1.5 h-1.5 rounded-full ${dot}"></span>${escapeHtml(status)}</span>`;
    }

    function getTagBadge(tag) {
      const upper = tag.toUpperCase();
      if (upper === 'NEW') return `<span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-emerald-500 text-white">NEW</span>`;
      if (upper === 'HOT') return `<span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-rose-500 text-white">HOT</span>`;
      if (upper === 'TRENDING') return `<span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-amber-500 text-white">TRENDING</span>`;
      if (upper === 'POINTS') return `<span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-blue-50 text-blue-600 dark:bg-blue-500/20 dark:text-blue-300">POINTS</span>`;
      return `<span class="px-2 py-0.5 rounded-md text-[10px] font-medium bg-slate-100 text-slate-600 dark:bg-zinc-800 dark:text-zinc-300">${escapeHtml(tag)}</span>`;
    }

    function renderLogo(item, size = 'w-11 h-11 text-sm') {
      if (item.logoUrl) {
        return `<div class="${size} rounded-xl overflow-hidden shrink-0 border border-slate-200/70 dark:border-zinc-700 bg-white dark:bg-zinc-800 shadow-xs"><img src="${escapeAttr(item.logoUrl)}" alt="${escapeAttr(item.name)}" class="w-full h-full object-cover" /></div>`;
      }
      return `<div class="${size} rounded-xl flex items-center justify-center font-extrabold tracking-tight shrink-0 shadow-xs text-white" style="background:${escapeAttr(item.logoBg || '#1e293b')}">${escapeHtml(item.logoText || item.name.slice(0, 2).toUpperCase())}</div>`;
    }

    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
    function escapeAttr(str) { return escapeHtml(str); }

    // =========================================================================
    // RIGHT SIDEBAR (Manual Sidebar Ads + Quick Checkers + Sentiment + Community)
    // =========================================================================
    function renderRightSidebar(topWidget = '', bottomWidget = '') {
      const adsHtml = (state.ads.sidebarAds || []).filter(ad => ad.active).map(ad => {
        if (ad.htmlCode && ad.htmlCode.trim()) {
          return `<a href="${escapeAttr(ad.url || '#')}" target="_blank" rel="noopener" class="block rounded-2xl overflow-hidden border border-slate-200/70 dark:border-zinc-800 shadow-bk hover:shadow-bk-hover transition-all">${ad.htmlCode}</a>`;
        }
        if (ad.imageUrl && ad.imageUrl.trim()) {
          const isVid = ad.isVideo || /\.(mp4|webm|ogg)(\?|$)/i.test(ad.imageUrl) || ad.imageUrl.startsWith('data:video/');
          return `
            <a href="${escapeAttr(ad.url || '#')}" target="_blank" rel="noopener" class="relative block rounded-2xl overflow-hidden border border-slate-200/70 dark:border-zinc-800 shadow-bk hover:shadow-bk-hover transition-all group">
              ${isVid
                ? `<video src="${escapeAttr(ad.imageUrl)}" autoplay loop muted playsinline class="w-full h-64 object-cover block"></video>`
                : `<img src="${escapeAttr(ad.imageUrl)}" alt="${escapeAttr(ad.title || 'Sponsored')}" class="w-full h-64 object-cover block" />`}
              <span class="absolute top-2.5 left-2.5 px-2 py-0.5 rounded-md text-[10px] font-bold bg-slate-900/75 text-white backdrop-blur-xs">${escapeHtml(ad.title || 'SPONSORED')}</span>
              <span class="absolute bottom-2.5 right-2.5 inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-[11px] font-bold bg-white/90 text-slate-900 shadow-xs">${escapeHtml(ad.ctaText || 'Learn more')} ${SVG.arrowUpRight}</span>
            </a>
          `;
        }
        return `
          <a href="${escapeAttr(ad.url)}" target="_blank" rel="noopener" class="block rounded-2xl bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 text-white p-5 border border-slate-800 shadow-bk hover:shadow-bk-hover transition-all group overflow-hidden">
            <div class="flex items-center justify-between mb-2.5">
              <span class="font-bold text-sm text-emerald-400 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-400"></span>${escapeHtml(ad.title)}
              </span>
              <span class="inline-flex items-center gap-1 text-[10px] px-2 py-0.5 rounded-md bg-white/10 text-zinc-200 font-medium">${escapeHtml(ad.ctaText || 'Learn more')} ${SVG.arrowUpRight}</span>
            </div>
            <div class="text-lg font-extrabold leading-snug mb-1">${escapeHtml(ad.headline)}</div>
            <div class="text-xs text-slate-300">${escapeHtml(ad.subtitle)}</div>
          </a>
        `;
      }).join('');

      const promoCardsHtml = (state.ads.sidebarPromoCards || []).filter(c => c.active !== false).map(c => `
        <a href="${escapeAttr(c.url || '#')}" target="_blank" rel="noopener" class="flex items-center justify-between gap-3 p-3.5 rounded-2xl bg-white dark:bg-zinc-900 border border-slate-200/80 dark:border-zinc-800 hover:border-blue-300 dark:hover:border-blue-500/40 shadow-bk hover:shadow-bk-hover transition-all group">
          <div class="flex items-center gap-3 min-w-0">
            ${c.imageUrl
              ? `<img src="${escapeAttr(c.imageUrl)}" alt="${escapeAttr(c.title)}" class="w-10 h-10 rounded-xl object-cover shrink-0 border border-slate-200/60 dark:border-zinc-700" />`
              : `<div class="w-10 h-10 rounded-xl flex items-center justify-center text-white font-extrabold text-xs shrink-0" style="background:${escapeAttr(c.bg || '#2563eb')}">${escapeHtml(c.initials || c.title.slice(0,2).toUpperCase())}</div>`}
            <div class="min-w-0">
              <div class="text-xs font-bold text-slate-900 dark:text-white truncate group-hover:text-blue-600 dark:group-hover:text-blue-400">${escapeHtml(c.title)}</div>
              <div class="text-[11px] text-slate-500 dark:text-zinc-400 truncate">${escapeHtml(c.desc)}</div>
            </div>
          </div>
          <span class="w-7 h-7 rounded-lg bg-[#f7f9fc] dark:bg-zinc-800 border border-slate-200/70 dark:border-zinc-700 flex items-center justify-center text-slate-500 shrink-0 group-hover:bg-slate-900 group-hover:text-white dark:group-hover:bg-white dark:group-hover:text-slate-900 transition-colors">${SVG.arrowUpRight}</span>
        </a>
      `).join('');

      const comm = state.settings.communityCard;
      return `
        <aside class="space-y-4 lg:sticky lg:top-20 lg:self-start">
          ${topWidget}
          ${adsHtml}
          <div class="space-y-2.5">${promoCardsHtml}</div>
          ${bottomWidget}
          <div class="rounded-2xl bg-white dark:bg-zinc-900 border border-slate-200/70 dark:border-zinc-800 p-4 shadow-bk">
            <div class="text-sm font-bold text-slate-900 dark:text-white mb-1">${escapeHtml(comm.title)}</div>
            <p class="text-xs text-slate-500 dark:text-zinc-400 mb-3">${escapeHtml(comm.subtitle)}</p>
            <a href="${escapeAttr(comm.ctaUrl)}" target="_blank" rel="noopener" class="w-full inline-flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 dark:bg-white dark:hover:bg-zinc-200 text-white dark:text-slate-900 text-xs font-bold transition-colors">
              <span>${escapeHtml(comm.ctaText)}</span> ${SVG.arrowUpRight}
            </a>
          </div>
        </aside>
      `;
    }

    function renderTopBanners() {
      const activeBanners = (state.ads.topBanners || []).filter(b => b.active);
      if (!activeBanners.length) return '';
      return `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5 mb-6">
          ${activeBanners.map(b => {
            const hasHtml = b.htmlCode && b.htmlCode.trim();
            const hasMedia = b.imageUrl && b.imageUrl.trim();
            const isVid = hasMedia && (b.isVideo || /\.(mp4|webm|ogg)(\?|$)/i.test(b.imageUrl) || b.imageUrl.startsWith('data:video/'));
            return `
              <a href="${escapeAttr(b.url || '#')}" target="_blank" rel="noopener" class="relative block h-20 sm:h-24 overflow-hidden rounded-2xl bg-gradient-to-r ${escapeAttr(b.gradient || 'from-blue-600 to-indigo-600')} shadow-bk hover:shadow-bk-hover transition-all group">
                ${hasHtml ? `<div class="w-full h-full overflow-hidden">${b.htmlCode}</div>` : ''}
                ${!hasHtml && hasMedia ? (
                  isVid
                    ? `<video src="${escapeAttr(b.imageUrl)}" autoplay loop muted playsinline class="w-full h-full object-cover block"></video>`
                    : `<img src="${escapeAttr(b.imageUrl)}" alt="${escapeAttr(b.badge || 'Ad')}" class="w-full h-full object-cover block" />`
                ) : ''}
                <span class="absolute top-2 left-2.5 px-2 py-0.5 rounded-md text-[9px] font-bold tracking-wider uppercase bg-slate-900/65 text-white backdrop-blur-xs">${escapeHtml(b.badge || 'SPONSORED')}</span>
                <span class="absolute right-3 top-1/2 -translate-y-1/2 inline-flex items-center gap-1 px-3.5 py-1.5 rounded-xl bg-white/90 hover:bg-white text-slate-900 text-xs font-bold shadow-xs transition-transform group-hover:scale-105">Open ${SVG.arrowUpRight}</span>
              </a>
            `;
          }).join('')}
        </div>
      `;
    }

    // AIRDROPS & PERPS PAGE (Bullkarry Simplicity + AlphaDrops Flow)
    // =========================================================================

    function renderHomePage() {
      const featured = state.airdrops.filter(a => a.featured);

      const activeCount = state.airdrops.filter(a => a.status === 'Active').length;

              </div>
            </div>
          </section>

    function toggleFaq(i) {

      if (!ans) return;

    function animateHomeStats() {
      const row = document.getElementById('homeStatsRow');
      if (!row) return;
      let ran = false;
      const runAnim = () => {
        if (ran) return;
        ran = true;
        const duration = 2200;
        const start = performance.now();
        const numEls = row.querySelectorAll('.stat-num');
        const textEls = row.querySelectorAll('.stat-text-num');
        function tick(now) {
          const t = Math.min(1, (now - start) / duration);
          const ease = 1 - Math.pow(1 - t, 3);
          numEls.forEach(el => {
            const target = parseInt(el.getAttribute('data-count') || '0', 10);
            el.textContent = Math.round(target * ease);
          });
          textEls.forEach(el => {
            const raw = el.getAttribute('data-stat-text') || '80K+';
            const m = raw.match(/^(\d+)(.*)$/);
            if (m) {
              const target = parseInt(m[1], 10);
              el.textContent = Math.round(target * ease) + m[2];
            } else {
              el.textContent = raw;
            }
          });
          if (t < 1) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      };
      if ('IntersectionObserver' in window) {
        const obs = new IntersectionObserver((entries) => {
          if (entries.some(e => e.isIntersecting)) { runAnim(); obs.disconnect(); }
        }, { threshold: 0.2 });
        obs.observe(row);
      } else {
        runAnim();
      }
    }

                  <button onclick="toggleSaveTracker('${item.id}')" class="inline-flex items-center gap-1.5 px-3 py-2.5 rounded-xl border border-slate-200/80 dark:border-zinc-700 text-xs font-bold ${isSaved ? 'bg-blue-50 text-blue-600 border-blue-200 dark:bg-blue-500/15 dark:text-blue-400' : 'hover:bg-slate-50 dark:hover:bg-zinc-800'} transition-colors">

              <p class="text-sm text-slate-500 dark:text-zinc-400">Your saved projects, farming stages, and custom daily tasks.</p>
            </div>
            <button onclick="addCustomTaskPrompt('General')" class="px-4 py-2.5 rounded-xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 text-xs font-bold">+ Add Custom Task</button>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${savedProjects.map(p => {
              const total = (p.tasks || []).length || 1;
              const doneCount = (p.tasks || []).filter(t => state.tracker.completedTasks[t.id]).length;
              const pct = Math.round((doneCount / total) * 100);
              return `
                <div class="rounded-2xl bg-white dark:bg-zinc-900 border border-slate-200/70 dark:border-zinc-800 p-5 shadow-bk">
                  <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center gap-3">
                      ${renderLogo(p, 'w-10 h-10 text-xs')}
                      <div>
                        <div class="font-bold text-sm">${escapeHtml(p.name)}</div>
                        <div class="text-[11px] text-slate-400">${doneCount}/${(p.tasks||[]).length} tasks completed</div>
                      </div>
                    </div>
                    <button onclick="navigateTo('detail', '${p.id}')" class="text-xs font-bold text-blue-600 dark:text-blue-400 hover:underline inline-flex items-center gap-1">Open ${SVG.arrowRight}</button>
                  </div>
                  <div class="h-2 rounded-full bg-slate-100 dark:bg-zinc-800 overflow-hidden"><div class="h-full bg-emerald-500 transition-all" style="width:${pct}%"></div></div>
                </div>
              `;
            }).join('')}
          </div>
          <div class="rounded-2xl bg-white dark:bg-zinc-900 border border-slate-200/70 dark:border-zinc-800 p-5 shadow-bk">
            <h3 class="text-sm font-bold mb-3">Custom Farming Tasks</h3>

              ${state.tracker.customTasks.map(ct => `

                    <span class="text-xs font-semibold ${ct.done ? 'line-through text-slate-400' : ''}">${escapeHtml(ct.title)}</span>
                    <span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-blue-50 text-blue-600 dark:bg-blue-500/15 dark:text-blue-400">${escapeHtml(ct.project)}</span>
                  </label>
                  <button onclick="deleteCustomTask('${ct.id}')" class="text-xs font-semibold text-rose-500 hover:underline">Remove</button>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function toggleClaimYear(yr) {
      const el = document.getElementById('claimYr-' + yr);
      const ic = document.getElementById('claimYrIc-' + yr);
      if (!el) return;
      const hidden = el.classList.contains('hidden');
      el.classList.toggle('hidden');
      if (ic) ic.style.transform = hidden ? 'rotate(180deg)' : 'rotate(0deg)';
    }

      const pr = (state.perpProtocols || []).find(x => x.id === calcProtoId) || (state.perpProtocols || [])[0];

      if (!out) return;

      if (calcModeTab === 'pointValue') {
        const fdvRaw = Math.max(0, Number(calcState.fdv || 0));
        const fdvUsd = fdvRaw * (calcFdvUnit === 'B' ? 1e9 : 1e6);
        const yourPts = Math.max(0, Number(calcState.yourPts || 0));
        const allocPct = Math.max(0, Number(calcState.alloc || 0));
        const totalPtsNum = Math.max(1, parseCompactNum(calcState.totalPts || pr.latestPts));
        const poolUsd = fdvUsd * (allocPct / 100);
        const ptVal = poolUsd / totalPtsNum;
        const sharePct = (yourPts / totalPtsNum) * 100;
        const estVal = yourPts * ptVal;
        const fdvDisplay = '$' + fdvRaw.toFixed(1) + calcFdvUnit;

        lastCalcResult = { ptVal, sharePct, estVal, fdvDisplay, pool: poolUsd, totalPtsNum, yourPts, allocPct };

        const headlineLabel = yourPts > 0 ? `Your ${yourPts.toLocaleString()} ${pr.name} points could be worth` : `Each ${pr.name} point could be worth`;
        const headlineNum = yourPts > 0 ? '$' + estVal.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '$' + ptVal.toFixed(6);

        out.innerHTML = `
          <div>

    function downloadCalcCardPng() {
      const pr = (state.perpProtocols || []).find(x => x.id === calcProtoId) || (state.perpProtocols || [])[0];
      const r = lastCalcResult;
      const canvas = document.createElement('canvas');
      canvas.width = 800; canvas.height = 440;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#09090b'; ctx.fillRect(0, 0, 800, 440);
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 28px Inter, sans-serif';
      ctx.fillText(pr.name + ' — Estimated Airdrop', 48, 72);
      ctx.fillStyle = '#34d399'; ctx.font = 'bold 64px Inter, sans-serif';
      const valStr = r.yourPts > 0 ? '$' + r.estVal.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '$' + r.ptVal.toFixed(4);
      ctx.fillText(valStr, 48, 200);
      ctx.fillStyle = '#a1a1aa'; ctx.font = '20px Inter, sans-serif';
      ctx.fillText(`Points: ${r.yourPts.toLocaleString()}   |   FDV: ${r.fdvDisplay}   |   Pool: ${r.allocPct}%   |   1 pt = $${r.ptVal.toFixed(4)}`, 48, 290);
      ctx.fillText(`Made with ${state.settings.brandName || 'Bullkarry'}`, 48, 385);
      const a = document.createElement('a');
      a.download = `${pr.id}-airdrop-estimate.png`;
      a.href = canvas.toDataURL('image/png');
      a.click();
      showToast('Result image downloaded!');
    }

    function sendResetOtp() {
      const email = (document.getElementById('resetEmailIn')?.value || '').trim().toLowerCase();
      const target = (state.settings.adminEmail || 'admin@bullkarry.com').trim().toLowerCase();
      if (email !== target) return showToast('Email does not match registered admin email');
      pendingOtp = String(Math.floor(100000 + Math.random() * 900000));
      document.getElementById('resetOtpHint').textContent = `Verification code sent to ${email}: ${pendingOtp}`;
      document.getElementById('resetStep2').classList.remove('hidden');
      document.getElementById('sendOtpBtn').classList.add('hidden');
    }
    function completePasswordReset() {
      const otp = document.getElementById('resetOtpIn')?.value.trim();
      const np = document.getElementById('resetNewPassIn')?.value.trim();
      if (otp !== pendingOtp) return showToast('Invalid verification code');
      if (!np || np.length < 4) return showToast('Password must be at least 4 characters');
      state.settings.adminPassword = np;
      saveState(); adminUnlocked = true; closeModal(); navigateTo('admin');
      showToast('Password reset successfully!');
    }

                  <input value="${escapeAttr(t.url || '')}" oninput="editorDraft.tasks[${ti}].url=this.value" placeholder="Start URL" class="flex-1 px-2.5 py-1.5 rounded-lg bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-700" />

          <div class="flex items-center justify-between pt-2">
            <div class="flex flex-wrap gap-4">
              <label class="text-xs font-semibold flex items-center gap-2"><input id="edFeatured" type="checkbox" ${d.featured?'checked':''} onchange="editorDraft.featured=this.checked" /> Featured Carousel</label>
              <label class="text-xs font-semibold flex items-center gap-2"><input id="edMarquee" type="checkbox" ${d.marquee!==false?'checked':''} onchange="editorDraft.marquee=this.checked" /> Show in Marquee Strip</label>

    function saveAirdropEditor() {
      const d = editorDraft;
      if (!d.name.trim()) return showToast('Project name is required');
      const isEdit = d._isEdit;
      delete d._isEdit;
      if (isEdit) state.airdrops = state.airdrops.map(a => a.id === d.id ? d : a);
      else state.airdrops.unshift(d);
      saveState(); renderAll(); openAdminModal();
      showToast(isEdit ? 'Airdrop updated!' : 'New airdrop published!');
    }

    // File Upload Readers (Base64 DataURL)
    function readImageFile(input, cb) {
      const file = input.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => cb(reader.result);
      reader.readAsDataURL(file);
    }
    function uploadAirdropLogo(input) {
      readImageFile(input, dataUrl => { editorDraft.logoUrl = dataUrl; renderAirdropEditorModal(); showToast('Logo uploaded!'); });
    }
    function uploadBrandLogo(input) {
      readImageFile(input, dataUrl => { state.settings.brandLogoUrl = dataUrl; saveState(); renderAll(); openAdminModal(); showToast('Brand logo updated!'); });
    }
    function uploadImageToBanner(idx, input) {
      const isVid = input.files?.[0]?.type?.startsWith('video/');
      readImageFile(input, dataUrl => { state.ads.topBanners[idx].imageUrl = dataUrl; state.ads.topBanners[idx].isVideo = !!isVid; saveState(); renderMain(); showToast('Banner media uploaded!'); });
    }
    function uploadImageToSidebarAd(idx, input) {
      const isVid = input.files?.[0]?.type?.startsWith('video/');
      readImageFile(input, dataUrl => { state.ads.sidebarAds[idx].imageUrl = dataUrl; state.ads.sidebarAds[idx].isVideo = !!isVid; saveState(); renderMain(); showToast('Sidebar ad media uploaded!'); });
    }

    function addSidebarAd() {
      state.ads.sidebarAds.push({ id: 'sad-' + Date.now(), title: 'Partner', headline: 'Featured Web3 Protocol', subtitle: 'Explore live opportunities', ctaText: 'Learn more', imageUrl: '', url: 'https://alphadrops.net', active: true });
      saveState(); renderMain(); openAdminModal();
    }
    function deleteSidebarAd(idx) {
      state.ads.sidebarAds.splice(idx, 1);
      saveState(); renderMain(); openAdminModal();
    }

    function exportStateJson() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'bullkarry-drops-backup.json'; a.click();
      URL.revokeObjectURL(url);
      showToast('Backup exported!');
    }
    function importStateJson(input) {
      const file = input.files?.[0];
      if (!file) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const parsed = JSON.parse(r.result);
          state = { ...structuredClone(DEFAULT_STATE), ...parsed };
          saveState(); renderAll(); openAdminModal(); showToast('Backup imported!');
        } catch (e) { showToast('Invalid JSON file'); }
      };
      r.readAsText(file);
    }

    // =========================================================================
    // OTHER INTERACTIVE ACTIONS
    // =========================================================================
    function quickUpdateStatus(id, status) { state.airdrops = state.airdrops.map(a => a.id === id ? { ...a, status } : a); saveState(); renderAll(); showToast('Status updated'); }
    function toggleFeatured(id) { state.airdrops = state.airdrops.map(a => a.id === id ? { ...a, featured: !a.featured } : a); saveState(); renderAll(); }
    function toggleMarquee(id) { state.airdrops = state.airdrops.map(a => a.id === id ? { ...a, marquee: a.marquee === false ? true : false } : a); saveState(); renderAll(); }
    function deleteAirdrop(id) { state.airdrops = state.airdrops.filter(a => a.id !== id); saveState(); renderAll(); openAdminModal(); showToast('Airdrop deleted'); }
    function addMenuItem() { state.menus.push({ id: 'custom-' + Date.now(), label: 'New Menu', icon: 'star', visible: true }); saveState(); renderChrome(); openAdminModal(); }
    function updateMenuLabel(id, val) { state.menus = state.menus.map(m => m.id === id ? { ...m, label: val } : m); saveState(); renderChrome(); }
    function updateMenuIcon(id, val) { state.menus = state.menus.map(m => m.id === id ? { ...m, icon: val } : m); saveState(); renderChrome(); }
    function toggleMenuVisible(id) { state.menus = state.menus.map(m => m.id === id ? { ...m, visible: !m.visible } : m); saveState(); renderChrome(); }
    function moveMenu(idx, dir) { const t = idx + dir; if (t < 0 || t >= state.menus.length) return; [state.menus[idx], state.menus[t]] = [state.menus[t], state.menus[idx]]; saveState(); renderChrome(); openAdminModal(); }

    function openHistoryAdder() {
      openModal(`
        <div class="w-full max-w-md rounded-2xl bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 p-6 shadow-2xl space-y-3 text-xs">

            <input id="hYr" value="2026" placeholder="Year (e.g. 2026)" class="px-3 py-2 rounded-xl bg-[#f7f9fc] dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 font-bold" />
            <input id="hMo" value="August" placeholder="Month (e.g. August)" class="px-3 py-2 rounded-xl bg-[#f7f9fc] dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 font-bold" />
          </div>
          <input id="hProjs" placeholder="Project names (comma separated, e.g. Alpha, Beta)" class="w-full px-3 py-2 rounded-xl bg-[#f7f9fc] dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700" />
          <button onclick="saveHistoryEntry()" class="w-full py-2.5 rounded-xl bg-blue-600 text-white font-bold">Add to History</button>
        </div>
      `);
    }
    function saveHistoryEntry() {
      const yr = document.getElementById('hYr').value.trim() || '2026';
      const mo = document.getElementById('hMo').value.trim() || 'January';
      const projs = document.getElementById('hProjs').value.split(',').map(x=>x.trim()).filter(Boolean);
      if (!projs.length) return showToast('Enter at least one project');
      let yrObj = state.claimHistory.find(y => y.year === yr);
      if (!yrObj) { yrObj = { year: yr, countLabel: projs.length + ' projects', months: [] }; state.claimHistory.unshift(yrObj); }
      let moObj = yrObj.months.find(m => m.month.toLowerCase() === mo.toLowerCase());
      if (moObj) moObj.projects.push(...projs);
      else yrObj.months.unshift({ month: mo, projects: projs });
      saveState(); renderMain(); adminUnlocked = true; openAdminModal(); showToast('Added to History!');
    }

            <input id="rzCat" value="${escapeAttr(r.category)}" placeholder="Category (e.g. DeFi, AI)" class="px-3 py-2 rounded-xl bg-[#f7f9fc] dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700" />
            <input id="rzFund" value="${escapeAttr(r.funding)}" placeholder="Funding (e.g. $50M)" class="px-3 py-2 rounded-xl bg-[#f7f9fc] dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 font-bold" />
            <select id="rzRound" class="px-3 py-2 rounded-xl bg-[#f7f9fc] dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700">
              ${['Seed','Seed Round','Series A','Series B','Founding Round','Strategic'].map(rd => `<option value="${rd}" ${r.round===rd?'selected':''}>${rd}</option>`).join('')}
            </select>
            <input id="rzDate" value="${escapeAttr(r.date)}" placeholder="Date (e.g. Nov 17, 2026)" class="px-3 py-2 rounded-xl bg-[#f7f9fc] dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700" />
          </div>
          <input id="rzInv" value="${escapeAttr(r.investors)}" placeholder="Lead Investor (e.g. Polychain Capital)" class="w-full px-3 py-2 rounded-xl bg-[#f7f9fc] dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700" />
          <input id="rzExtra" value="${escapeAttr(r.extraInvestors || '')}" placeholder="Extra Investors (e.g. 3 other investors)" class="w-full px-3 py-2 rounded-xl bg-[#f7f9fc] dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700" />
          <button onclick="saveRaiseEditor('${r.id}', ${!!id})" class="w-full py-2.5 rounded-xl bg-blue-600 text-white font-bold">Save Raise</button>
        </div>
      `);
    }
    function saveRaiseEditor(id, isEdit) {
      const fStr = document.getElementById('rzFund').value.trim() || '$0M';
      const fNum = parseFloat(fStr.replace(/[^0-9.]/g, '')) || 0;
      const obj = {
        id,
        project: document.getElementById('rzProj').value.trim() || 'Untitled Project',
        category: document.getElementById('rzCat').value.trim() || 'DeFi',
        funding: fStr,
        fundingNum: fNum,
        round: document.getElementById('rzRound').value,
        investors: document.getElementById('rzInv').value.trim() || 'Undisclosed',
        extraInvestors: document.getElementById('rzExtra').value.trim(),
        date: document.getElementById('rzDate').value.trim() || 'Nov 17, 2026'
      };
      if (isEdit) state.raises = state.raises.map(x => x.id === id ? obj : x);
      else state.raises.unshift(obj);
      saveState(); renderMain(); adminUnlocked = true; openAdminModal(); showToast('Raise saved!');
    }

    function openCheckerEditor(id) {
      const c = id ? state.checkers.find(x => x.id === id) : { id: 'chk-' + Date.now(), title: '', desc: '', tags: ['Checker'], url: 'https://alphadrops.net/checker', interactive: null };
      openModal(`
        <div class="w-full max-w-md rounded-2xl bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 p-6 shadow-2xl space-y-3 text-xs">
          <div class="flex items-center justify-between"><h3 class="text-base font-extrabold">${id ? 'Edit Checker' : 'Add Checker'}</h3><button onclick="adminUnlocked=true; openAdminModal();" class="text-blue-600 font-bold">← Back</button></div>
          <input id="ckTitle" value="${escapeAttr(c.title)}" placeholder="Checker Title" class="w-full px-3 py-2 rounded-xl bg-[#f7f9fc] dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 font-semibold" />
          <input id="ckDesc" value="${escapeAttr(c.desc)}" placeholder="Short Description" class="w-full px-3 py-2 rounded-xl bg-[#f7f9fc] dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700" />
          <input id="ckTags" value="${escapeAttr((c.tags||[]).join(', '))}" placeholder="Tags (comma separated)" class="w-full px-3 py-2 rounded-xl bg-[#f7f9fc] dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700" />
          <input id="ckUrl" value="${escapeAttr(c.url)}" placeholder="Target URL" class="w-full px-3 py-2 rounded-xl bg-[#f7f9fc] dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700" />
          <div class="flex gap-2 items-center">
            <input id="ckLogoUrl" value="${escapeAttr(c.logoUrl || '')}" placeholder="Logo Image URL (or upload)" class="flex-1 px-3 py-2 rounded-xl bg-[#f7f9fc] dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700" />
            <label class="px-3 py-2 rounded-xl bg-blue-50 text-blue-600 font-bold cursor-pointer">${SVG.upload} File<input type="file" accept="image/*" class="hidden" onchange="readImageFile(this, u => { document.getElementById('ckLogoUrl').value = u; showToast('Checker icon ready!'); })" /></label>
          </div>
          <button onclick="saveCheckerEditor('${c.id}', ${!!id})" class="w-full py-2.5 rounded-xl bg-blue-600 text-white font-bold">Save Checker</button>
        </div>
      `);
    }
    function saveCheckerEditor(id, isEdit) {
      const obj = {
        id,
        title: document.getElementById('ckTitle').value.trim() || 'New Checker',
        desc: document.getElementById('ckDesc').value.trim() || 'Eligibility checker tool',
        tags: document.getElementById('ckTags').value.split(',').map(x=>x.trim()).filter(Boolean),
        url: document.getElementById('ckUrl').value.trim() || 'https://alphadrops.net/checker',
        logoUrl: document.getElementById('ckLogoUrl').value.trim(),
        interactive: isEdit ? (state.checkers.find(x=>x.id===id)?.interactive || null) : null
      };
      if (isEdit) state.checkers = state.checkers.map(x => x.id === id ? obj : x);
      else state.checkers.push(obj);
      saveState(); renderMain(); adminUnlocked = true; openAdminModal(); showToast('Checker saved!');
    }
    function deleteChecker(id) { state.checkers = state.checkers.filter(c => c.id !== id); saveState(); renderMain(); adminUnlocked = true; openAdminModal(); }
    function addSidebarPromoCard() {
      if (!state.ads.sidebarPromoCards) state.ads.sidebarPromoCards = [];
      state.ads.sidebarPromoCards.push({ id: 'spc-' + Date.now(), title: 'New Tool', desc: 'Check eligibility & rewards...', imageUrl: '', bg: '#2563eb', initials: 'NT', url: 'https://alphadrops.net', active: true });
      saveState(); renderMain(); adminUnlocked = true; openAdminModal();
    }
    function deleteSidebarPromoCard(i) { state.ads.sidebarPromoCards.splice(i, 1); saveState(); renderMain(); adminUnlocked = true; openAdminModal(); }
    function uploadPerpProtoLogo(pi, input) { readImageFile(input, dataUrl => { state.perpProtocols[pi].logoUrl = dataUrl; saveState(); renderMain(); adminUnlocked = true; openAdminModal(); showToast('Protocol logo uploaded!'); }); }
    function uploadImageToPromoCard(i, input) { readImageFile(input, dataUrl => { state.ads.sidebarPromoCards[i].imageUrl = dataUrl; saveState(); renderMain(); showToast('Icon uploaded!'); }); }

    function addClaimAdmin() { state.claims.unshift({ id: 'cl-' + Date.now(), project: 'New Claim', token: 'TKN', amount: 'Season 1', chain: 'Base', deadline: 'Open', status: 'Open', url: 'https://alphadrops.net/claim' }); saveState(); renderMain(); openAdminModal(); }
    function deleteClaim(id) { state.claims = state.claims.filter(c => c.id !== id); saveState(); renderMain(); openAdminModal(); }
    function addRaiseAdmin() { state.raises.unshift({ id: 'rz-' + Date.now(), project: 'New Protocol', category: 'DeFi', funding: '$10M', fundingNum: 10, round: 'Seed', investors: 'Paradigm', extraInvestors: '', date: 'Nov 17, 2026' }); saveState(); renderMain(); openAdminModal(); }
    function deleteRaise(id) { state.raises = state.raises.filter(r => r.id !== id); saveState(); renderMain(); openAdminModal(); }
    function resetToDefaults() { state = structuredClone(DEFAULT_STATE); saveState(); renderAll(); openAdminModal(); showToast('Reset to defaults'); }

    function toggleSaveTracker(id) {
      const idx = state.tracker.savedIds.indexOf(id);
      if (idx >= 0) state.tracker.savedIds.splice(idx, 1); else state.tracker.savedIds.push(id);
      saveState(); renderAll(); showToast(idx >= 0 ? 'Removed from Tracker' : 'Added to Tracker!');
    }
    function toggleTaskDone(tid) { state.tracker.completedTasks[tid] = !state.tracker.completedTasks[tid]; saveState(); renderMain(); }
    function toggleCustomTask(cid) { state.tracker.customTasks = state.tracker.customTasks.map(t => t.id === cid ? { ...t, done: !t.done } : t); saveState(); renderMain(); }
    function deleteCustomTask(cid) { state.tracker.customTasks = state.tracker.customTasks.filter(t => t.id !== cid); saveState(); renderMain(); }

    function copyShareLink() {
      try { navigator.clipboard.writeText(window.location.href); } catch (e) {}
      showToast('Airdrop link copied!');
    }

    function addCustomTaskPrompt(project) {
      openModal(`
        <div class="w-full max-w-sm rounded-2xl bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 p-5 shadow-xl">
          <h3 class="text-sm font-extrabold mb-3">Add Custom Task (${escapeHtml(project)})</h3>
          <input id="ctInput" type="text" placeholder="e.g. Bridge 100 USDC weekly" class="w-full px-3 py-2.5 rounded-xl bg-[#f7f9fc] dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 text-xs mb-3" />
          <div class="flex justify-end gap-2">
            <button onclick="closeModal()" class="px-3 py-2 rounded-xl text-xs font-semibold text-slate-500">Cancel</button>
            <button onclick="saveCustomTask('${escapeAttr(project)}')" class="px-4 py-2 rounded-xl bg-blue-600 text-white text-xs font-bold">Add Task</button>
          </div>
        </div>
      `);
    }

    function saveCustomTask(project) {
      const title = document.getElementById('ctInput')?.value.trim();
      if (!title) return;
      state.tracker.customTasks.unshift({ id: 'ct-' + Date.now(), project, title, done: false });
      saveState(); closeModal();
      if (currentRoute === 'tracker') renderMain();
      showToast('Added to Tracker!');
    }

    function voteProject(id) {
      state.airdrops = state.airdrops.map(a => a.id === id ? { ...a, votes: (a.votes || 0) + 1 } : a);
      saveState(); renderMain(); showToast('Vote recorded!');
    }

    function scanWalletDemo() {
      const addr = document.getElementById('walletScanInput')?.value.trim();
      const res = document.getElementById('walletScanResult');
      if (!addr) return showToast('Enter a wallet address first');
      res.innerHTML = `<div class="p-3 rounded-xl bg-emerald-50 dark:bg-emerald-500/10 border border-emerald-200 dark:border-emerald-500/30 text-emerald-700 dark:text-emerald-300 font-semibold">Scanned <span class="font-mono">${escapeHtml(addr.slice(0,10))}...</span> — 2 open claim portals available above (Ondo Perps, RateX DEX).</div>`;
    }

    function openSafetyChecklist() {
      openModal(`
        <div class="w-full max-w-sm rounded-2xl bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 p-5 shadow-xl">
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-sm font-extrabold inline-flex items-center gap-1.5">${SVG.shield} Safety Checklist</h3>
            <button onclick="closeModal()" class="text-slate-400">${SVG.close}</button>
          </div>
          <ul class="space-y-2 text-xs text-slate-600 dark:text-zinc-300">
            <li class="flex items-center gap-2"><span class="text-emerald-500">${SVG.check}</span> Complete all tasks to maximize allocation</li>
            <li class="flex items-center gap-2"><span class="text-emerald-500">${SVG.check}</span> Stay consistent with daily interactions</li>
            <li class="flex items-center gap-2"><span class="text-emerald-500">${SVG.check}</span> Verify every link before connecting wallets</li>
            <li class="flex items-center gap-2"><span class="text-emerald-500">${SVG.check}</span> Follow official channels only</li>
            <li class="flex items-center gap-2"><span class="text-emerald-500">${SVG.check}</span> Interact at your own risk (DYOR)</li>
          </ul>
        </div>
      `);
    }

    function openCalculatorModal(type) {
      if (type === 'perpCalc') {
        openModal(`<div class="w-full max-w-lg rounded-2xl bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 p-5 shadow-xl"><div class="flex justify-end mb-2"><button onclick="closeModal()" class="text-slate-400">${SVG.close}</button></div>${renderPerpCalculatorCard()}</div>`);
        setTimeout(calcPerp, 20);
      } else {
        openModal(`
          <div class="w-full max-w-md rounded-2xl bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 p-5 shadow-xl space-y-3">
            <div class="flex items-center justify-between"><h3 class="text-sm font-extrabold">APY Yield Calculator</h3><button onclick="closeModal()" class="text-slate-400">${SVG.close}</button></div>
            <div class="grid grid-cols-2 gap-3 text-xs">
              <div><label class="font-semibold">Principal ($)</label><input id="apyP" type="number" value="1000" oninput="calcApy()" class="w-full mt-1 px-3 py-2 rounded-xl bg-[#f7f9fc] dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 font-bold" /></div>
              <div><label class="font-semibold">APY (%)</label><input id="apyR" type="number" value="18" oninput="calcApy()" class="w-full mt-1 px-3 py-2 rounded-xl bg-[#f7f9fc] dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 font-bold" /></div>
            </div>
            <div id="apyOut" class="p-3 rounded-xl bg-[#f7f9fc] dark:bg-zinc-800 text-xs font-bold"></div>
          </div>
        `);
        setTimeout(calcApy, 20);
      }
    }

    function calcApy() {
      const p = Math.max(0, Number(document.getElementById('apyP')?.value || 0));
      const r = Math.max(0, Number(document.getElementById('apyR')?.value || 0)) / 100;
      const simple = p * (1 + r);
      const comp = p * Math.pow(1 + r / 12, 12);
      const out = document.getElementById('apyOut');
      if (out) out.innerHTML = `1-Year Simple: $${simple.toFixed(2)} • Monthly Compounded: <span class="text-emerald-600">$${comp.toFixed(2)}</span>`;
    }

    // =========================================================================
    // CAROUSEL, MODALS, TOASTS & RENDER LOOP
    // =========================================================================
    function slideCarousel(dir) {
      const el = document.getElementById('featuredCarousel');
      if (el) el.scrollBy({ left: dir * 260, behavior: 'smooth' });
    }
    function startCarouselAuto() {
      if (carouselTimer) clearInterval(carouselTimer);
      carouselTimer = setInterval(() => {
        const el = document.getElementById('featuredCarousel');
        if (!el) return;
        if (el.scrollLeft + el.clientWidth >= el.scrollWidth - 10) el.scrollTo({ left: 0, behavior: 'smooth' });
        else el.scrollBy({ left: 260, behavior: 'smooth' });
      }, 4500);
    }
    function openModal(html) {
      const root = document.getElementById('modalRoot');
      root.innerHTML = html; root.classList.remove('hidden'); root.classList.add('flex');
    }
    function closeModal() { if (currentRoute !== 'admin') adminUnlocked = false;
      const root = document.getElementById('modalRoot');
      root.classList.add('hidden'); root.classList.remove('flex'); root.innerHTML = '';
    }
    function showToast(msg) {
      const root = document.getElementById('toastRoot');
      const el = document.createElement('div');
      el.className = 'px-4 py-2.5 rounded-xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 text-xs font-bold shadow-lg animate-fade-up';
      el.textContent = msg; root.appendChild(el);
      setTimeout(() => el.remove(), 2600);
    }
    function renderMainListOnly() { renderMain(); }
    function renderMain() {
      const main = document.getElementById('mainContent');
      if (currentRoute === 'admin') { if (!adminUnlocked) { navigateTo('home'); openAdminGate(); return; } main.innerHTML = renderFullAdminPage(); }
      else if (currentRoute === 'detail') main.innerHTML = renderDetailPage();
      else if (currentRoute === 'airdrops') main.innerHTML = renderAirdropsPage(false);
      else if (currentRoute === 'perps') { main.innerHTML = renderAirdropsPage(true); if (filters.perpsTab === 'calculator') calcPerp(); }
      else if (currentRoute === 'tracker') main.innerHTML = renderTrackerPage();
      else if (currentRoute === 'claims') main.innerHTML = renderClaimsPage();
      else if (currentRoute === 'perpCalculator') { main.innerHTML = renderPerpCalculatorPage(); calcPerp(); }
      else if (currentRoute === 'checkers') main.innerHTML = renderCheckersPage();
      else if (currentRoute === 'raises') main.innerHTML = renderRaisesPage();
      else { main.innerHTML = renderHomePage(); animateHomeStats(); }
    }
    function renderAll() { renderChrome(); renderMain(); }

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
    let lastScrollY = 0;
    window.addEventListener('scroll', () => {
      const h = document.getElementById('topHeader');
      if (!h) return;
      const cur = window.scrollY || 0;
      if (cur > 70 && cur > lastScrollY) h.classList.add('-translate-y-full');
      else h.classList.remove('-translate-y-full');
      lastScrollY = cur;
    }, { passive: true });

    window.onload = () => { initTheme(); renderAll(); startCarouselAuto(); };
  </script>
</body>
</html>
